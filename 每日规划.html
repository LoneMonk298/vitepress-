<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>每日规划 · 80 天冲刺</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text2: #64748b; --text3: #94a3b8;
  --brand: #667eea; --brand2: #764ba2; --brand-soft: #eef2ff;
  --ok: #10b981; --warn: #f59e0b; --danger: #ef4444;
}
body.dark {
  --bg: #0f172a; --card: #1e293b; --border: #334155;
  --text: #f1f5f9; --text2: #cbd5e1; --text3: #94a3b8;
  --brand-soft: rgba(102,126,234,0.14);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  padding-bottom: 40px; transition: background 0.3s, color 0.3s;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.layout .main-col { min-width: 0; }
.layout .side-col { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.layout .sec { margin-top: 0; }
.layout .sec + .sec { margin-top: 20px; }
@media (max-width: 1000px) {
  .wrap { max-width: 960px; }
  .layout { grid-template-columns: 1fr; }
  .layout .side-col { flex-direction: column; }
  .layout .sec, .layout .sec + .sec { margin-top: 26px; }
  .layout .sec:first-child, .layout .sec + .sec:first-child { margin-top: 0; }
}

/* ===== header ===== */
.hero {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white; padding: 26px 0 22px; position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px;
  border-radius: 50%; background: rgba(255,255,255,0.08);
}
.hero-row { display: flex; align-items: center; justify-content: space-between; }
.hero h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
.hero-date { font-size: 13px; opacity: 0.9; margin-top: 4px; }
.hero-stats { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.hero-chip {
  background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
  border-radius: 12px; padding: 10px 16px; min-width: 110px;
}
.hero-chip .num { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hero-chip .lbl { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.hero-chip .num small { font-size: 14px; opacity: 0.8; font-weight: 600; }
.focus-session {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 12px; padding: 12px 16px;
  background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
  border: 1px solid rgba(255,255,255,0.3); border-radius: 12px;
  backdrop-filter: blur(8px);
}
.focus-session .fs-icon { font-size: 22px; }
.focus-session .fs-label {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  background: rgba(255,255,255,0.25); color: white; text-transform: uppercase; letter-spacing: 0.5px;
}
.focus-session .fs-title { font-size: 16px; font-weight: 700; color: white; flex: 1; }
.focus-session .fs-time {
  font-size: 14px; font-weight: 800; color: white;
  background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 6px;
  font-variant-numeric: tabular-nums;
}
.focus-session .fs-cat {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  background: rgba(255,255,255,0.2); color: white;
}
.focus-session .fs-check {
  padding: 6px 14px; border-radius: 8px; border: none;
  background: white; color: #1e293b; font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: inherit;
}
.focus-session .fs-check:hover { background: #f1f5f9; }
.focus-session .fs-left { font-size: 12px; font-weight: 700; color: #fde68a; }
.focus-session.next { background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06)); }
.focus-session.empty { background: rgba(255,255,255,0.12); }
.focus-session .fs-bar {
  position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
  background: rgba(255,255,255,0.15); border-radius: 0 0 12px 12px; overflow: hidden;
}
.focus-session .fs-bar i { display: block; height: 100%; background: linear-gradient(90deg, #fde68a, #fbbf24); transition: width 0.5s; }
.weekly {
  margin-bottom: 16px; padding: 14px;
  border: 1px solid var(--border); border-radius: 12px; background: var(--card);
}
.weekly.sunday {
  border: 2px solid #f59e0b;
  background: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(245,158,11,0.02));
}
.weekly-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
}
.weekly-title {
  font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px;
}
.weekly-info { font-size: 11px; color: var(--text3); }
.weekly-stats {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.weekly-pill {
  font-size: 12px; padding: 5px 11px; border-radius: 16px;
  background: var(--bg); color: var(--text2); font-weight: 700;
}
.weekly-pill b { color: var(--brand); font-size: 14px; margin: 0 2px; }
.weekly-pill.fire b { color: #ef4444; }
.weekly-list { display: flex; flex-direction: column; gap: 8px; }
.weekly-dim {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: 10px; background: var(--bg);
}
.weekly-dim.all {
  background: rgba(16,185,129,0.08);
  border: 1px solid rgba(16,185,129,0.3);
}
.weekly-dim-icon { font-size: 18px; flex-shrink: 0; padding-top: 1px; }
.weekly-dim-body { flex: 1; min-width: 0; }
.weekly-dim-name {
  font-size: 13px; font-weight: 700; margin-bottom: 5px;
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.weekly-dim-cnt { font-size: 11px; color: var(--text3); font-weight: 600; }
.weekly-dim-cnt.done { color: var(--ok); }
.weekly-item {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 4px 0; font-size: 12px; color: var(--text2); line-height: 1.5;
  cursor: pointer;
}
.weekly-item input { margin-top: 2px; flex-shrink: 0; }
.weekly-item.checked { color: var(--text3); text-decoration: line-through; }
.weekly-item b { color: var(--text); font-weight: 700; }
.weekly-actions {
  display: flex; gap: 8px; justify-content: center; margin-top: 12px;
}
.weekly-save {
  padding: 8px 22px; border-radius: 9px; border: none;
  background: linear-gradient(135deg, #f59e0b, #ef4444); color: white;
  font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.weekly-save:hover { filter: brightness(1.1); }
.weekly-save:disabled { background: var(--border); color: var(--text3); cursor: not-allowed; }
.weekly-hint {
  text-align: center; font-size: 11px; color: var(--text3); margin-top: 10px;
}
.weekly-empty {
  text-align: center; padding: 20px; font-size: 13px; color: var(--text3);
}

.focus-session { position: relative; overflow: hidden; }
.stage-chip { margin-top: 14px; background: rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 16px; }
.stage-chip .s-name { font-size: 14px; font-weight: 700; }
.stage-chip .s-range { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.stage-bar { height: 5px; background: rgba(255,255,255,0.25); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.stage-bar i { display: block; height: 100%; background: #fbbf24; border-radius: 3px; transition: width 0.5s; }
.hero-foot { margin-top: 10px; font-size: 11px; opacity: 0.8; }

/* ===== 通用卡片 ===== */
.sec { margin-top: 26px; }
.sec-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.sec-title small { font-weight: 400; color: var(--text3); font-size: 12px; margin-left: auto; }

/* ===== 分类样式 ===== */
.cat-badge {
  font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 7px;
  flex-shrink: 0;
}
.cat-select {
  font-size: 10px; font-weight: 700; padding: 2px 4px; border-radius: 7px;
  border: none; font-family: inherit; cursor: pointer; flex-shrink: 0;
  appearance: none; -webkit-appearance: none; text-align: center;
}
.cat-select:focus { outline: 2px solid var(--brand); }
.cat-badge.cat-new { background: #fed7aa; color: #9a3412; }
.cat-badge.cat-english, .cat-select.cat-english { background: rgba(59,130,246,0.18); color: #1d4ed8; }
.cat-badge.cat-ds, .cat-select.cat-ds { background: rgba(96,165,250,0.2); color: #1d4ed8; }
.cat-badge.cat-os, .cat-select.cat-os { background: rgba(244,114,182,0.2); color: #be185d; }
.cat-badge.cat-cn, .cat-select.cat-cn { background: rgba(52,211,153,0.2); color: #047857; }
.cat-badge.cat-cs, .cat-select.cat-cs { background: rgba(251,191,36,0.24); color: #b45309; }
.cat-badge.cat-politics, .cat-select.cat-politics { background: rgba(236,72,153,0.2); color: #be185d; }
body.dark .cat-select.cat-english, body.dark .cat-select.cat-ds { background: rgba(59,130,246,0.25); color: #93c5fd; }
body.dark .cat-select.cat-os, body.dark .cat-select.cat-politics { background: rgba(236,72,153,0.25); color: #f9a8d4; }
body.dark .cat-select.cat-cn { background: rgba(52,211,153,0.25); color: #6ee7b7; }
body.dark .cat-select.cat-cs { background: rgba(251,191,36,0.25); color: #fcd34d; }
body.dark .cat-select.cat-new { background: rgba(249,115,22,0.25); color: #fdba74; }
body.dark .cat-select.cat-review, body.dark .cat-select.cat-math { background: rgba(34,197,94,0.25); color: #86efac; }
body.dark .cat-select.cat-memory { background: rgba(168,85,247,0.25); color: #d8b4fe; }
body.dark .cat-select.cat-break, body.dark .cat-select.cat-other { background: rgba(100,116,139,0.25); color: #cbd5e1; }
.btn-report {
  padding: 8px 14px; border-radius: 9px; border: none;
  background: linear-gradient(135deg, #667eea, #764ba2); color: white;
  font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.btn-report:hover { filter: brightness(1.1); }
.add-bar { justify-content: space-between; gap: 12px; padding: 10px 14px; }
.ab-preview { font-size: 12px; color: var(--text2); flex: 1; }
.ab-preview b { color: var(--brand); font-weight: 800; }
.ab-add {
  padding: 9px 18px; border-radius: 9px; border: 2px dashed var(--brand);
  background: var(--brand-soft); color: var(--brand); font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.ab-add:hover { background: var(--brand); color: white; }

.done-toggle {
  font-size: 12px; color: var(--text3); cursor: pointer; padding: 6px 4px;
  text-align: center; user-select: none;
}
.done-toggle:hover { color: var(--brand); }
.cat-badge.cat-review { background: #dcfce7; color: #15803d; }
.cat-badge.cat-memory { background: #f3e8ff; color: #6b21a8; }
.cat-badge.cat-break { background: #f1f5f9; color: #64748b; }
.cat-badge.cat-other { background: #e0e7ff; color: #4338ca; }
.cat-badge.cat-en { background: #dbeafe; color: #1e40af; }
.cat-badge.cat-math { background: #dcfce7; color: #15803d; }
.cat-badge.cat-408 { background: #fef3c7; color: #b45309; }
.cat-badge.cat-pol { background: #fce7f3; color: #be185d; }
body.dark .cat-badge.cat-new { background: rgba(249,115,22,0.2); color: #fdba74; }
body.dark .cat-badge.cat-review { background: rgba(22,163,74,0.2); color: #86efac; }
body.dark .cat-badge.cat-memory { background: rgba(147,51,234,0.2); color: #d8b4fe; }
body.dark .cat-badge.cat-break { background: rgba(100,116,139,0.2); color: #cbd5e1; }
body.dark .cat-badge.cat-other { background: rgba(67,56,202,0.2); color: #c7d2fe; }
body.dark .cat-badge.cat-en { background: rgba(59,130,246,0.2); color: #93c5fd; }
body.dark .cat-badge.cat-math { background: rgba(22,163,74,0.2); color: #86efac; }
body.dark .cat-badge.cat-408 { background: rgba(217,119,6,0.2); color: #fcd34d; }
body.dark .cat-badge.cat-pol { background: rgba(190,24,93,0.2); color: #fbcfe8; }

/* ===== 自定义时间表（sessions）===== */
.sessions {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
}
.session-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.session {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
}
.session.now { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
.session.done { background: rgba(16,185,129,0.06); border-color: rgba(16,185,129,0.3); }
.session.done .session-title { text-decoration: line-through; color: var(--text3); }
.session-icon {
  width: 36px; height: 36px; border-radius: 8px; background: var(--brand-soft);
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.session-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.session-title { font-size: 14px; font-weight: 600; word-break: break-word; }
.session-meta { font-size: 11px; color: var(--text3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.session-time {
  font-size: 11px; font-weight: 700; color: var(--brand);
  background: var(--brand-soft); padding: 2px 8px; border-radius: 6px;
  font-variant-numeric: tabular-nums; flex-shrink: 0;
}
.session-title[contenteditable] { outline: none; border-radius: 4px; padding: 1px 4px; cursor: text; }
.session-title[contenteditable]:focus { background: var(--brand-soft); box-shadow: 0 0 0 2px rgba(102,126,234,0.25); }
.s-time-in { width: 96px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 12px; font-family: inherit; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.s-dur-in { width: 52px; padding: 4px 4px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 12px; font-family: inherit; text-align: center; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.s-time-in:focus, .s-dur-in:focus { outline: none; border-color: var(--brand); }
.session-range { font-size: 12px; font-weight: 800; color: var(--brand); padding: 4px 2px; font-variant-numeric: tabular-nums; flex-shrink: 0; white-space: nowrap; }
.routine-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.routine-bar button { padding: 8px 14px; border-radius: 9px; border: 1px dashed var(--brand); background: var(--brand-soft); color: var(--brand); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.routine-bar button:hover { background: var(--brand); color: white; }
.routine-bar .rb-hint { font-size: 11px; color: var(--text3); }
.routine-bar .rb-hint b { color: var(--brand); }
.session-duration {
  font-size: 11px; color: var(--text2); font-variant-numeric: tabular-nums;
  padding: 2px 8px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border);
  flex-shrink: 0;
}
.session-now-tag { font-size: 10px; color: var(--danger); font-weight: 700; }
.session-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.session-cb {
  width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: transparent; background: transparent; transition: all 0.15s;
}
.session-cb.on { background: var(--ok); border-color: var(--ok); color: white; }
.session-del {
  width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent;
  color: var(--text3); cursor: pointer; font-size: 13px;
}
.session-del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
.add-bar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 10px 12px; background: var(--bg); border-radius: 10px;
}
.add-bar input {
  flex: 1; min-width: 180px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 13px; font-family: inherit;
}
.add-bar input:focus { outline: none; border-color: var(--brand); }
.add-bar input[type="time"] { flex: 0 0 140px; min-width: 140px; font-size: 14px; padding: 9px 10px; }
.add-bar input[type="number"] { flex: 0 0 80px; min-width: 80px; text-align: center; font-size: 14px; padding: 9px 6px; }
.add-bar select {
  padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 12px; font-family: inherit;
  flex-shrink: 0;
}
.add-bar button {
  padding: 7px 14px; border-radius: 8px; border: none; font-family: inherit;
  background: linear-gradient(135deg, #667eea, #764ba2); color: white;
  font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
}
.add-bar button:hover { opacity: 0.9; }

/* ===== 自定义任务 ===== */
.tasks {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
}
.task-list { display: flex; flex-direction: column; gap: 6px; }
.task {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
}
.task.done { background: rgba(16,185,129,0.06); border-color: rgba(16,185,129,0.3); }
.task.done .task-title { text-decoration: line-through; color: var(--text3); }
.task-cb {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border);
  flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent; background: transparent; transition: all 0.15s;
}
.task-cb.on { background: var(--ok); border-color: var(--ok); color: white; }
.task-main { flex: 1; min-width: 0; }
.task-title { font-size: 13.5px; font-weight: 500; word-break: break-word; }
.task-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
.task-del {
  width: 24px; height: 24px; border-radius: 6px; border: none; background: transparent;
  color: var(--text3); cursor: pointer; font-size: 14px; flex-shrink: 0;
}
.task-del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
.task-add {
  display: flex; gap: 8px; margin-top: 10px;
}
.task-add input {
  flex: 1; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; min-width: 0;
}
.task-add input:focus { outline: none; border-color: var(--brand); }
.task-add button {
  padding: 8px 16px; border-radius: 10px; border: none; font-family: inherit;
  background: linear-gradient(135deg, #667eea, #764ba2); color: white;
  font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
}

/* ===== 关键节点 ===== */
.milestones {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
}
.ms-list { display: flex; flex-direction: column; gap: 6px; }
.ms-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
  border-left: 3px solid var(--brand);
}
.ms-item.past { opacity: 0.5; border-left-color: var(--text3); }
.ms-item.urgent { border-left-color: var(--danger); background: rgba(239,68,68,0.05); }
.ms-item.soon { border-left-color: var(--warn); background: rgba(245,158,11,0.05); }
.ms-icon {
  width: 32px; height: 32px; border-radius: 8px; background: var(--brand-soft);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.ms-main { flex: 1; min-width: 0; }
.ms-name { font-size: 13.5px; font-weight: 600; }
.ms-desc { font-size: 11px; color: var(--text3); margin-top: 2px; }
.ms-right { text-align: right; flex-shrink: 0; }
.ms-date {
  font-size: 11px; color: var(--text2); font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.ms-countdown {
  font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums;
  color: var(--brand); line-height: 1.2;
}
.ms-countdown.past { color: var(--text3); font-size: 12px; font-weight: 600; }
.ms-countdown.urgent { color: var(--danger); }
.ms-countdown.soon { color: var(--warn); }

<body>

  <div class="modal-box">
    <div class="modal-title">⚠️ 清空所有数据</div>
    <p style="font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 12px;">
      这将清空：<br>
      · 所有打卡记录<br>
      · 所有 AI 费曼复盘对话历史<br>
      · 所有日程计划<br>
      · 所有自定义任务<br>
      · 所有背诵卡片<br><br>
      <b>保留</b>：<br>
      · 408 考点表（与学习表共享的进度数据）
    </p>
    <div class="modal-actions">
      <button onclick="window.__resetCancel()">取消</button>
      <button class="primary" onclick="window.__resetConfirm()" style="background:var(--danger);border-color:transparent;">清空</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 数据键 =====
var DATA_KEY_V2 = 'kaoyan_408_v2';        // 主数据（sessions + tasks + reset 标记）
var SPRINT_START_V2 = '2026-09-29';       // 冲刺开始（今天）
var PLAN_END_V2 = '2026-12-18';           // 计划最后一天（公式背诵+调整心态）
var EXAM_DATE_V2 = '2026-12-19';          // 考试日
var FLASHCARDS_KEY = 'kaoyan_flashcards_v1';  // 背诵卡片（保留）
var DATA_KEY_V1 = 'kaoyan_408_study_data_v1'; // 408 考点表（保留）

// 80 天冲刺 4 阶段（含冲刺准备期）
var STAGES_V2 = [
  { id: 's1', name: '清尾攻坚', icon: '🚀', range: ['2026-09-29', '2026-10-20'],
    note: '数学一轮复习收尾 + 408 基础知识冲刺（10/15 完成基础转大题）' },
  { id: 's2', name: '真题启航', icon: '📝', range: ['2026-10-21', '2026-10-31'],
    note: '数学转真题 + 408 大题与代码（10/30 启动 408 真题）' },
  { id: 's3', name: '真题拉练', icon: '💪', range: ['2026-11-01', '2026-11-30'],
    note: '全科真题强化 + 政治入局' },
  { id: 's4', name: '弱点爆破', icon: '🎯', range: ['2026-12-01', '2026-12-11'],
    note: '查漏补缺，专攻薄弱章节' },
  { id: 's5', name: '终极保底', icon: '🛡️', range: ['2026-12-12', '2026-12-18'],
    note: '保底复习 + 12/18 公式背诵与心态调整' }
];

// 关键节点（倒计时）
var MILESTONES_V2 = [
  { date: '2026-10-15', icon: '📘', name: '408 基础收尾', desc: '结束基础知识，转大题与代码' },
  { date: '2026-10-20', icon: '📐', name: '数学一轮清尾', desc: '约 20 天一轮，转真题' },
  { date: '2026-10-30', icon: '📋', name: '408 真题启动', desc: '开始刷 408 历年真题' },
  { date: '2026-11-01', icon: '📜', name: '政治入局', desc: '政治开始系统复习' },
  { date: '2026-12-18', icon: '🧘', name: '公式背诵 · 调整心态', desc: '最后一天，轻量过公式' },
  { date: '2026-12-19', icon: '🎯', name: '考试日', desc: '上考场' }
];

// 类别（用于时间表 session）
var CATEGORIES = [
  { id: 'new',     name: '新学',  icon: '📐', color: '#f97316' },
  { id: 'review',  name: '复习',  icon: '📖', color: '#22c55e' },
  { id: 'memory',  name: '背诵',  icon: '🧠', color: '#a855f7' },
  { id: 'break',   name: '休息',  icon: '☕', color: '#64748b' },
  { id: 'english', name: '英语',  icon: '📚', color: '#3b82f6' },
  { id: 'math',    name: '数学',  icon: '📐', color: '#16a34a' },
  { id: 'ds',      name: '数据结构', icon: '🌳', color: '#60a5fa' },
  { id: 'os',      name: '操作系统', icon: '⚙️', color: '#f472b6' },
  { id: 'cn',      name: '计网',   icon: '🌐', color: '#34d399' },
  { id: 'cs',      name: '计组',   icon: '🔧', color: '#fbbf24' },
  { id: 'politics',name: '政治',   icon: '📜', color: '#ec4899' },
  { id: 'other',   name: '其他',  icon: '✨', color: '#94a3b8' }
];

// 背诵/默写关键词（用于任务完成时自动建复习卡片）
var KEYWORDS_REVIEW = ['背诵','默写','背过','记忆','复述','熟记','记住','背下来','默背'];

var REVIEW_INTERVALS = [1, 2, 4, 7, 15, 30];

// ===== 工具 =====
function pad(n) { return String(n).padStart(2, '0'); }
function getTodayStr() {
  var t = new Date();
  return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
}
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function addDays(dateStr, n) {
  var dt = new Date(dateStr + 'T00:00:00');
  dt.setDate(dt.getDate() + n);
  return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
function attrJsStr(s) {
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
    .replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function readJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
}

// ===== 数据加载/保存 =====
function initData() {
  var data = readJson(DATA_KEY_V2, null);
  if (data && data.date === getTodayStr()) return data;
  // 新的一天：尝试从昨日快照复用
  var snap = readJson(DATA_KEY_V2 + '_snapshot', null);
  data = {
    date: getTodayStr(),
    sessions: [],
    customTasks: [],
    resetV1: false
  };
  if (snap && (Array.isArray(snap.sessions) || Array.isArray(snap.customTasks))) {
    // 沿用昨日计划：done 全部重置为 false
    data.sessions = (snap.sessions || []).map(function(s) {
      return { id: 'c' + Date.now() + '_' + Math.floor(Math.random()*1000), time: s.time, duration: s.duration, cat: s.cat, title: s.title, done: false, framework: false };
    });
    data.customTasks = (snap.customTasks || []).map(function(t) {
      return { text: t.text, done: false, inferredCat: t.inferredCat, reviews: t.reviews || 0 };
    });
  }
  return data;
}
var data = initData();
function saveData() {
  localStorage.setItem(DATA_KEY_V2, JSON.stringify(data));
  // 同步存快照供次日复用（done 不存）
  localStorage.setItem(DATA_KEY_V2 + '_snapshot', JSON.stringify({
    date: data.date,
    sessions: (data.sessions || []).map(function(s) {
      return { time: s.time, duration: s.duration, cat: s.cat, title: s.title };
    }),
    customTasks: (data.customTasks || []).map(function(t) {
      return { text: t.text, inferredCat: t.inferredCat, reviews: t.reviews || 0 };
    })
  }));
}

// ===== 关键词检测 =====
function isReviewTask(text) {
  if (!text) return false;
  return KEYWORDS_REVIEW.some(function (k) { return text.indexOf(k) >= 0; });
}
function inferCategory(text) {
  if (!text) return '其他';
  if (/英语|单词|真题|阅读/.test(text)) return '英语真题单词';
  if (/公式|积分|行列式|特征值|导数|微分/.test(text)) return '数学公式';
  if (/408|计组|操作|OS|计网|Cache|进程|线程|路由|TCP/.test(text)) return '408口诀';
  if (/政治|马原|毛中特|史纲|思修|时政/.test(text)) return '政治口诀';
  return '其他';
}

// ===== 清空数据 =====
function doClearAll() {
  localStorage.removeItem(DATA_KEY_V2);
  localStorage.removeItem('kaoyan_daily_plan_v1');
  localStorage.removeItem('kaoyan_408_activity_log');
  localStorage.removeItem('kaoyan_schedule_v1');
  localStorage.removeItem('kaoyan_hermes_history');
  localStorage.removeItem(FLASHCARDS_KEY);
  // 保留 kaoyan_408_study_data_v1（考点表）
  data = { date: getTodayStr(), sessions: [], customTasks: [], resetV1: true };
  saveData();
  render();
}
function clearAllConfirm() {
  openModal('⚠️ 清空所有数据',
    '<p style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:12px;">' +
    '这将清空：<br>' +
    '· 所有时间表<br>' +
    '· 所有自定义任务<br>' +
    '· 所有背诵卡片<br>' +
    '· 所有打卡记录<br><br>' +
    '<b>保留</b>：<br>' +
    '· 408 考点表（与学习表共享的进度数据）' +
    '</p>' +
    '<div class="modal-actions">' +
    '<button onclick="window.__closeModal()">取消</button>' +
    '<button class="primary" onclick="window.__doClearAll()" style="background:var(--danger);border-color:transparent;">清空</button>' +
    '</div>'
  );
}

// ===== 阶段计算 =====
function getSprintStats() {
  var today = getTodayStr();
  var totalDays = daysBetween(SPRINT_START_V2, EXAM_DATE_V2);
  var dayIndex = daysBetween(SPRINT_START_V2, today);
  var daysLeft = daysBetween(today, EXAM_DATE_V2);
  
  var currentStage = null;
  var stagePct = 0;
  for (var i = 0; i < STAGES_V2.length; i++) {
    var st = STAGES_V2[i];
    if (today >= st.range[0] && today <= st.range[1]) {
      currentStage = st;
      var stageLen = daysBetween(st.range[0], st.range[1]) + 1;
      stagePct = Math.min(100, Math.max(0, Math.round((daysBetween(st.range[0], today) + 1) / stageLen * 100)));
      break;
    }
  }
  
  return {
    dayIndex: dayIndex,
    totalDays: totalDays,
    daysLeft: daysLeft,
    stage: currentStage,
    stagePct: stagePct
  };
}

// ===== 工具 =====
function catById(id) {
  for (var i = 0; i < CATEGORIES.length; i++) {
    if (CATEGORIES[i].id === id) return CATEGORIES[i];
  }
  return CATEGORIES[CATEGORIES.length - 1];
}
function fmtClock(timeStr) {
  if (!timeStr) return '';
  var parts = timeStr.split(':');
  return (parseInt(parts[0]) || 0) + ':' + (parts[1] || '00');
}
function fmtClockEnd(startStr, duration) {
  if (!startStr) return '';
  var parts = startStr.split(':');
  var m = (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0);
  m += (parseInt(duration) || 0);
  var h = Math.floor(m / 60) % 24;
  var mm = m % 60;
  return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}
function getDueFlashcards() {
  var fcs = readJson(FLASHCARDS_KEY, []);
  var today = getTodayStr();
  return fcs.filter(function (f) {
    return f.status === 'active' && f.nextReviewAt <= today;
  });
}

// ===== 时间表操作 =====
function addSession(time, duration, title, catId) {
  if (!title || !title.trim()) {
    showToast('请输入标题', 'error');
    return;
  }
  data.sessions.push({
    id: 's_' + Date.now(),
    time: time || '',
    duration: duration || 30,
    title: title.trim(),
    cat: catId || 'other',
    done: false
  });
  saveData();
  render();
}
function deleteSession(id) {
  data.sessions = data.sessions.filter(function (s) { return s.id !== id; });
  saveData();
  render();
}
function toggleSession(id) {
  data.sessions.forEach(function (s) {
    if (s.id === id) s.done = !s.done;
  });
  saveData();
  render();
}
function updateSession(id, field, value) {
  data.sessions.forEach(function (s) {
    if (s.id === id) s[field] = value;
  });
  saveData();
  render();
}

// ===== 任务操作 =====
function addTask(text) {
  if (!text || !text.trim()) return;
  data.customTasks.push({
    id: 't_' + Date.now(),
    text: text.trim(),
    done: false,
    addedAt: getTodayStr(),
    inferredCat: isReviewTask(text) ? inferCategory(text) : null
  });
  saveData();
  render();
}
function deleteTask(idx) {
  data.customTasks.splice(idx, 1);
  saveData();
  render();
}
function toggleTask(idx) {
  if (!data.customTasks[idx]) return;
  var t = data.customTasks[idx];
  t.done = !t.done;
  if (t.done && isReviewTask(t.text)) {
    // 创建/更新 flashcard
    var fcs = readJson(FLASHCARDS_KEY, []);
    var existing = fcs.find(function (f) {
      return f.status === 'active' && f.sourceCustom === t.id;
    });
    var today = getTodayStr();
    if (existing) {
      existing.attempts = (existing.attempts || 0) + 1;
      existing.lastReviewedAt = today;
      var i2 = Math.min(existing.attempts, REVIEW_INTERVALS.length - 1);
      existing.nextReviewAt = addDays(today, REVIEW_INTERVALS[i2]);
      localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(fcs));
      t.reviews = existing.attempts;
    } else {
      var fc = {
        id: 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        category: t.inferredCat || '其他',
        content: t.text,
        sourceCustom: t.id,
        learnedAt: today,
        attempts: 1,
        lastReviewedAt: today,
        nextReviewAt: addDays(today, REVIEW_INTERVALS[0]),
        status: 'active'
      };
      fcs.push(fc);
      localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(fcs));
      t.reviews = 1;
    }
  }
  saveData();
  render();
}

function toggleFlashcard(id) {
  var fcs = readJson(FLASHCARDS_KEY, []);
  var fc = fcs.find(function (f) { return f.id === id; });
  if (!fc) return;
  fc.attempts = (fc.attempts || 0) + 1;
  fc.lastReviewedAt = getTodayStr();
  var idx2 = Math.min(fc.attempts, REVIEW_INTERVALS.length - 1);
  fc.nextReviewAt = addDays(getTodayStr(), REVIEW_INTERVALS[idx2]);
  localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(fcs));
  // 同步 customTask
  if (data.customTasks) {
    data.customTasks.forEach(function (t) {
      if (isReviewTask(t.text)) {
        var fc2 = readJson(FLASHCARDS_KEY, []).find(function (f) { return f.id === id; });
        if (fc2 && fc2.sourceCustom === t.id) {
          t.reviews = fc2.attempts;
        }
      }
    });
    saveData();
  }
  render();
}
function deleteFlashcard(id) {
  var fcs = readJson(FLASHCARDS_KEY, []);

}

function getWeekIdx(d) {
  var date = d ? new Date(d) : new Date();
  var time = Math.floor(date.getTime() / 1000);
  var day = date.getDay() === 0 ? 7 : date.getDay();
  return Math.floor((time - 252460800 + (day - 1) * 86400) / 604800);
}
function getWeeklyHistory() {

function weeklyTotalCount() {
  var n = 0; WEEKLY_CHECK.forEach(function (d) { n += d.items.length; }); return n;
}
function weeklyStreak() {
  var h = getWeeklyHistory();
  var cur = getWeekIdx();
  var n = 0;
  for (var i = 0; i < 52; i++) {
    var w = h[cur - i];
    if (w && w.pct >= 80) n++;
    else if (i === 0) continue;
    else break;
  }
  return n;
}

// ===== AI 顾问：考点进度 =====
function hermesReport() {
  var appData = readJson(DATA_KEY_V1, null);
  if (!appData || !Object.keys(appData).length) {
    openModal('📊 考点进度', '<p style="font-size:13px;color:var(--text2);line-height:1.7;">还没有 408 考点数据。请先打开 <a href="考研408考点学习管理表.html" style="color:var(--brand);font-weight:600;">408 学习表</a> 初始化考点数据。</p>');
    return;
  }
  var sheets = ['Sheet1_数据结构', 'Sheet2_计算机组成原理', 'Sheet3_操作系统', 'Sheet4_计算机网络'];
  var display = { 'Sheet1_数据结构': '数据结构', 'Sheet2_计算机组成原理': '组成原理', 'Sheet3_操作系统': '操作系统', 'Sheet4_计算机网络': '计算机网络' };
  var html = '<div style="display:flex;flex-direction:column;gap:10px;">';
  sheets.forEach(function (sheet) {
    var items = appData[sheet] || [];
    var total = items.length;
    var mastered = items.filter(function (it) { return it['掌握程度'] === '已掌握'; }).length;
    var learning = items.filter(function (it) { return it['掌握程度'] === '学习中'; }).length;
    var pct = total ? Math.round(mastered / total * 100) : 0;
    html += '<div style="background:var(--bg);border-radius:10px;padding:10px 12px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">';
    html += '<span style="font-size:13px;font-weight:700;">' + display[sheet] + '</span>';
    html += '<span style="font-size:16px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;">' + pct + '%</span>';
    html += '</div>';
    html += '<div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px;">';
    html += '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#667eea,#10b981);"></div>';
    html += '</div>';
    html += '<div style="font-size:11px;color:var(--text3);">已掌握 <b>' + mastered + '</b> · 学习中 <b>' + learning + '</b> · 未开始 <b>' + (total - mastered - learning) + '</b> / ' + total + '</div>';
    html += '</div>';
  });
  html += '</div>';
  openModal('📊 408 考点进度（共享数据）', html);
}

window.__autoAddSession = function() {
  // 自动按最后时段结束时间+15min 生成新行，默认 45min，类别继承
  var time = '08:00';
  var duration = 45;
  var cat = 'math';
  if (data.sessions.length > 0) {
    var ls = data.sessions[data.sessions.length - 1];
    time = fmtClockEnd(ls.time, ls.duration);
    // 往后推 15 分钟
    var p = time.split(':');
    var m = (parseInt(p[0]) || 0) * 60 + (parseInt(p[1]) || 0) + 15;
    time = String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    cat = ls.cat;
  }
  var seq = data.sessions.length + 1;
  var title = '学习 ' + seq;
  addSession(time, duration, title, cat);
  // 滚动到新行
  setTimeout(function() {
    var el = document.querySelector('.session-list .session:last-child');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var titleEl = el && el.querySelector('.session-title');
    if (titleEl) titleEl.focus();
  }, 50);
  showToast('已添加 · ' + time + ' 起 ' + duration + ' 分钟', 'success');
}

  });
  var report = {
    date: today,
    sprint: {
      start: SPRINT_START_V2,
      exam: EXAM_DATE_V2,
      day: stats.dayIndex,
      daysLeft: stats.daysLeft,
      stage: stats.stage ? stats.stage.name : '冲刺准备期'
    },
    summary: {
      totalSessions: sessions.length,
      doneSessions: sessions.filter(function(s){return s.done;}).length,
      totalTasks: tasks.length,
      doneTasks: tasks.filter(function(t){return t.done;}).length,
      dueReviews: dueCards.length
    },
    todaySessions: sessions,
    todayTasks: tasks,
    dueReviewCards: reviewCards,
    generatedAt: new Date().toISOString()
  };
  // 存到 localStorage 供导出/查看

};
