<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学强化考点取舍表 · 27考研</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f5f7fb; --card: #fff; --text: #1f2937; --text2: #4b5563; --text3: #9ca3af;
  --border: #e5e7eb; --brand: #667eea; --brand2: #764ba2;
  --ok: #10b981; --warn: #f59e0b; --bad: #ef4444;
}
body.dark {
  --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --text2: #cbd5e1; --text3: #64748b;
  --border: #334155;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5; padding: 20px;
  transition: background .3s, color .3s;
}
.container { max-width: 1200px; margin: 0 auto; }

/* header */
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff; padding: 20px 26px; border-radius: 12px; margin-bottom: 16px;
  box-shadow: 0 4px 12px rgba(102,126,234,.3);
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
}
.header h1 { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
.header p { font-size: 13px; opacity: .9; }
.header-right { text-align: right; }
.countdown { font-size: 13px; opacity: .95; }
.countdown b { font-size: 24px; font-weight: 800; margin: 0 2px; }
.theme-btn {
  margin-top: 8px; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4);
  color: #fff; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px;
  font-family: inherit;
}
.theme-btn:hover { background: rgba(255,255,255,.3); }

/* stats */
.stats-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card {
  background: var(--card); border-radius: 10px; padding: 14px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05); border: 1px solid var(--border);
}
.stat-card .label { font-size: 12px; color: var(--text3); margin-bottom: 5px; font-weight: 600; }
.stat-card .value { font-size: 24px; font-weight: 800; line-height: 1.1; }
.stat-card.must .value { color: var(--ok); }
.stat-card.opt .value { color: var(--warn); }
.stat-card.skip .value { color: var(--bad); }
.stat-card.todo .value { color: var(--text3); }

/* toolbar */
.toolbar {
  background: var(--card); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
  border: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
.tb-group { display: flex; gap: 6px; align-items: center; }
.tb-label { font-size: 12px; color: var(--text3); font-weight: 700; margin-right: 2px; }
.tb-btn {
  padding: 6px 13px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text2); font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all .15s;
}
.tb-btn:hover { border-color: var(--brand); color: var(--brand); }
.tb-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }
.tb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
#search {
  flex: 1; min-width: 150px; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 13px; font-family: inherit;
}
.export-btn {
  padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer;
  background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
  font-size: 13px; font-weight: 700; font-family: inherit;
}

/* legend */
.legend {
  background: var(--card); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
  border: 1px solid var(--border); font-size: 12px; color: var(--text2);
  display: flex; flex-wrap: wrap; gap: 16px;
}
.legend b { color: var(--text); }
.legend .lg { display: flex; align-items: center; gap: 5px; }

/* chapters */
.chapter {
  background: var(--card); border-radius: 10px; margin-bottom: 12px;
  border: 1px solid var(--border); overflow: hidden;
}
.chapter.only-other { opacity: .55; }
.ch-head {
  padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  background: linear-gradient(90deg, rgba(102,126,234,.06), transparent);
  border-bottom: 1px solid var(--border);
}
.ch-head:hover { background: rgba(102,126,234,.1); }
.ch-arrow { font-size: 11px; color: var(--text3); transition: transform .2s; }
.chapter.open .ch-arrow { transform: rotate(90deg); }
.ch-num { font-size: 12px; font-weight: 800; color: var(--brand); background: rgba(102,126,234,.12); padding: 3px 8px; border-radius: 6px; }
.ch-name { font-size: 14px; font-weight: 700; flex: 1; }
.ch-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgba(239,68,68,.12); color: var(--bad); }
.ch-count { font-size: 12px; color: var(--text3); }
.ch-progress { font-size: 12px; font-weight: 700; color: var(--ok); }
.ch-body { display: none; }
.chapter.open .ch-body { display: block; }

table { width: 100%; border-collapse: collapse; }
th {
  font-size: 11px; font-weight: 700; color: var(--text3); text-align: left;
  padding: 8px 10px; background: var(--bg); border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(102,126,234,.04); }
td.id { font-size: 12px; color: var(--text3); font-weight: 700; white-space: nowrap; }
td.title { color: var(--text); }
.st { font-size: 13px; letter-spacing: .5px; white-space: nowrap; font-weight: 700; }
.c1 { color: #cbd5e1; } .c2 { color: #f59e0b; } .c3-diff { color: var(--bad); }
.c3-val { color: var(--ok); } .c3-listen { color: #3b82f6; } .c3-upd { color: #f97316; }

.pick { display: flex; gap: 4px; }
.pick button {
  padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--text3); font-size: 11px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap;
}
.pick button:hover { border-color: var(--brand); }
.pick button.on-must { background: var(--ok); border-color: var(--ok); color: #fff; }
.pick button.on-opt { background: var(--warn); border-color: var(--warn); color: #fff; }
.pick button.on-skip { background: var(--bad); border-color: var(--bad); color: #fff; }

.empty { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }
.footer { text-align: center; font-size: 11px; color: var(--text3); padding: 20px 0; }

@media (max-width: 720px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .header { padding: 16px; }
  .header h1 { font-size: 17px; }
  th:nth-child(1), td:nth-child(1) { display: none; }
}
</style>
</head>

<div class="container">
  <div class="header">
    <div>
      <h1>📐 数学强化考点取舍表</h1>
      <p>张宇 27 考研「没咋了」强化课使用指南 · 星级原样保留，取舍由你决定</p>
    </div>
    <div class="header-right">

      <button class="theme-btn" onclick="toggleTheme()">🌙 切换主题</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card"><div class="label">当前视图小节</div><div class="value" id="s-total">0</div></div>
    <div class="stat-card must"><div class="label">🟢 必做</div><div class="value" id="s-must">0</div></div>
    <div class="stat-card opt"><div class="label">🟡 选做</div><div class="value" id="s-opt">0</div></div>
    <div class="stat-card skip"><div class="label">🔴 放弃</div><div class="value" id="s-skip">0</div></div>
    <div class="stat-card todo"><div class="label">⚪ 未判</div><div class="value" id="s-todo">0</div></div>
  </div>

  <div class="toolbar">
    <div class="tb-group">
      <span class="tb-label">科目</span>
      <button class="tb-btn active" data-scope="shu2" onclick="setScope(this)">数二</button>
      <button class="tb-btn" data-scope="all" onclick="setScope(this)">全部</button>

    <div class="tb-sep"></div>
    <div class="tb-group">

      <button class="tb-btn" data-q="val3" onclick="setQuick(this)">性价比★★★</button>
      <button class="tb-btn" data-q="listen3" onclick="setQuick(this)">听课★★★</button>
      <button class="tb-btn" data-q="diff3" onclick="setQuick(this)">难度★★★</button>
      <button class="tb-btn" data-q="undecided" onclick="setQuick(this)">未判</button>

    <input type="text" id="search" placeholder="搜索小节名…" oninput="render()">
    <button class="export-btn" onclick="exportPlan()">📤 导出取舍方案</button>
  </div>

  <div class="legend">
    <span class="lg"><b>难度</b> ★简单 ★★正常 ★★★较难</span>
    <span class="lg"><b>性价比</b> ★较低 ★★较高 ★★★很高（★★以上必学）</span>
    <span class="lg"><b>是否听课</b> ★可不听 ★★建议听 ★★★必听</span>
    <span class="lg"><b>更新幅度</b> ★少 ★★中 ★★★大</span>
    <span class="lg" style="color:var(--text3)">难度★★★但性价比★ = 时间紧可先跳过，有余力再补</span>
  </div>

  <div id="chapters"></div>
  <div class="footer">数据源：27 考研没咋了全程班强化使用指南 · 星级为原表评定，未做任何改动</div>
</div>

var KEY = 'kaoyan_math_pick_v1';
var scope = 'shu2';
var quick = '';

function loadPicks() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function savePicks(p) { localStorage.setItem(KEY, JSON.stringify(p)); }
function iKey(part, chNum, id) { return part + '|' + chNum + '|' + id; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function stars(n, col) {
  var s = '';
  for (var i = 0; i < n; i++) s += '★';
  for (var i = n; i < 3; i++) s += '☆';
  var cls = n === 1 ? 'c1' : (n === 2 ? 'c2' : col);
  return '<span class="st ' + cls + '">' + s + '</span>';
}

function isShu2(ch) {
  if (!ch.only) return true;
  if (ch.only.indexOf('仅数一、二') >= 0) return true;
  if (ch.only.indexOf('仅数一') >= 0) return false;
  if (ch.only.indexOf('仅数三') >= 0) return false;
  return true;
}

function visibleChapters() {
  var out = [];
  for (var i = 0; i < MATH_DATA.length; i++) {
    var ch = MATH_DATA[i];
    if (scope === 'shu2' && !isShu2(ch)) continue;
    out.push(ch);
  }
  return out;
}

function matchQuick(it, q) {
  if (!q) return true;
  if (q === 'val3') return it.value >= 3;
  if (q === 'listen3') return it.listen >= 3;
  if (q === 'diff3') return it.diff >= 3;
  if (q === 'undecided') {
    var p = loadPicks()[iKey(it._part, it._chNum, it.id)];
    return !p;
  }
  return true;
}

function render() {
  var picks = loadPicks();
  var kw = (document.getElementById('search').value || '').trim();
  var chs = visibleChapters();
  var stats = { total: 0, must: 0, opt: 0, skip: 0, todo: 0 };
  var html = '';
  var anyCh = false;

  for (var i = 0; i < chs.length; i++) {
    var ch = chs[i];
    var rows = [];
    for (var j = 0; j < ch.items.length; j++) {
      var it = ch.items[j];
      it._part = ch.part; it._chNum = ch.num;
      if (kw && it.title.indexOf(kw) < 0 && it.id.indexOf(kw) < 0) continue;
      if (!matchQuick(it, quick)) continue;
      rows.push(it);
    }
    if (!rows.length) continue;
    anyCh = true;

    var chMust = 0;
    for (var k = 0; k < ch.items.length; k++) {
      if (picks[iKey(ch.part, ch.num, ch.items[k].id)] === 'must') chMust++;
    }

    html += '<div class="chapter' + (isShu2(ch) ? '' : ' only-other') + (ch._open ? ' open' : '') + '" data-ch="' + i + '">';
    html += '<div class="ch-head" onclick="toggleCh(' + i + ')">';
    html += '<span class="ch-arrow">▶</span>';
    html += '<span class="ch-num">第' + ch.num + '章</span>';
    html += '<span class="ch-name">' + esc(ch.part) + ' · ' + esc(ch.name) + '</span>';
    if (ch.only) html += '<span class="ch-badge">' + esc(ch.only) + '</span>';
    html += '<span class="ch-progress">必做 ' + chMust + '/' + ch.items.length + '</span>';
    html += '<span class="ch-count">' + rows.length + ' 小节</span>';
    html += '</div><div class="ch-body"><table>';
    html += '<thead><tr><th>序号</th><th>小节标题</th><th>难度</th><th>性价比</th><th>听课</th><th>更新</th><th>我选</th></tr></thead><tbody>';

    for (var k2 = 0; k2 < rows.length; k2++) {
      var it2 = rows[k2];
      var key = iKey(ch.part, ch.num, it2.id);
      var p = picks[key] || '';
      stats.total++;
      if (p === 'must') stats.must++; else if (p === 'opt') stats.opt++;
      else if (p === 'skip') stats.skip++; else stats.todo++;

      html += '<tr>';
      html += '<td class="id">' + esc(it2.id) + '</td>';
      html += '<td class="title">' + esc(it2.title) + (it2.only ? ' <span class="ch-badge">' + esc(it2.only) + '</span>' : '') + '</td>';
      html += '<td>' + stars(it2.diff, 'c3-diff') + '</td>';
      html += '<td>' + stars(it2.value, 'c3-val') + '</td>';
      html += '<td>' + stars(it2.listen, 'c3-listen') + '</td>';
      html += '<td>' + stars(it2.update, 'c3-upd') + '</td>';
      html += '<td><div class="pick">'
        + '<button class="' + (p === 'must' ? 'on-must' : '') + '" onclick="pick(\'' + key + '\',\'must\')">必做</button>'
        + '<button class="' + (p === 'opt' ? 'on-opt' : '') + '" onclick="pick(\'' + key + '\',\'opt\')">选做</button>'
        + '<button class="' + (p === 'skip' ? 'on-skip' : '') + '" onclick="pick(\'' + key + '\',\'skip\')">放弃</button>'
        + '</div></td>';
      html += '</tr>';
    }
    html += '</tbody></table></div></div>';
  }

  document.getElementById('chapters').innerHTML = anyCh ? html : '<div class="empty">没有匹配的小节</div>';
  document.getElementById('s-total').textContent = stats.total;
  document.getElementById('s-must').textContent = stats.must;
  document.getElementById('s-opt').textContent = stats.opt;
  document.getElementById('s-skip').textContent = stats.skip;
  document.getElementById('s-todo').textContent = stats.todo;
}

function pick(key, val) {
  var picks = loadPicks();
  if (picks[key] === val) delete picks[key];
  else picks[key] = val;
  savePicks(picks);
  render();
}

var openState = {};
function toggleCh(i) {
  openState[i] = !openState[i];
  var el = document.querySelector('.chapter[data-ch="' + i + '"]');
  if (el) el.classList.toggle('open', !!openState[i]);
}

function setScope(btn) {
  scope = btn.dataset.scope;
  document.querySelectorAll('[data-scope]').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}
function setQuick(btn) {
  var q = btn.dataset.q;
  if (quick === q) { quick = ''; btn.classList.remove('active'); }
  else {
    quick = q;
    document.querySelectorAll('[data-q]').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
  }
  render();
}
function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('kaoyan_math_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}

function exportPlan() {
  var picks = loadPicks();
  var buckets = { must: [], opt: [], skip: [], todo: [] };
  for (var i = 0; i < MATH_DATA.length; i++) {
    var ch = MATH_DATA[i];
    for (var j = 0; j < ch.items.length; j++) {
      var it = ch.items[j];
      var p = picks[iKey(ch.part, ch.num, it.id)] || 'todo';
      buckets[p].push('  ' + it.id + ' ' + it.title + '  [难度' + '★'.repeat(it.diff) + ' 性价比' + '★'.repeat(it.value) + ' 听课' + '★'.repeat(it.listen) + ']'
        + (ch.only ? ' ' + ch.only : ''));
    }
  }
  var txt = '数学强化取舍方案 · ' + new Date().toLocaleDateString('zh-CN') + '\n';
  txt += '（数据源：27考研没咋了强化使用指南）\n\n';
  txt += '【必做 ' + buckets.must.length + '】\n' + (buckets.must.join('\n') || '  （空）') + '\n\n';
  txt += '【选做 ' + buckets.opt.length + '】\n' + (buckets.opt.join('\n') || '  （空）') + '\n\n';
  txt += '【放弃 ' + buckets.skip.length + '】\n' + (buckets.skip.join('\n') || '  （空）') + '\n\n';
  txt += '【未判 ' + buckets.todo.length + '】\n' + (buckets.todo.join('\n') || '  （空）') + '\n';

  var blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '数学强化取舍方案_' + new Date().toISOString().slice(0, 10) + '.txt';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

// 倒计时
(function () {
  var exam = new Date('2026-12-19T00:00:00');
  var days = Math.ceil((exam - new Date()) / 86400000);
  document.getElementById('countdown-days').textContent = days > 0 ? days : 0;
})();
// 主题恢复
if (localStorage.getItem('kaoyan_math_theme') === 'dark') document.body.classList.add('dark');

// 默认展开前 2 章
openState[0] = true; openState[1] = true;
render();
</script>
