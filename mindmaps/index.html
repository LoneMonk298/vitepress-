<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>408 思维导图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#f5f6f8;--card:#fff;--text:#1f2937;--text2:#6b7280;--bd:#e5e7eb;--pri:#667eea}
  html.dark{--bg:#16171a;--card:#202127;--text:#e5e7eb;--text2:#9ca3af;--bd:#33353d}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
  .app{display:flex;height:100vh}
  .sidebar{width:260px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:margin-left .2s}
  .sidebar.hide{margin-left:-260px}
  .side-h{padding:16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
  .side-h small{font-weight:400;color:var(--text2);font-size:11px}
  .side-list{flex:1;overflow-y:auto;padding:8px}
  .grp{margin-bottom:10px}
  .grp-t{font-size:12px;color:var(--text2);padding:8px 10px 4px;font-weight:600;letter-spacing:.5px}
  .ch{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .ch:hover{background:var(--bg)}
  .ch.on{background:linear-gradient(135deg,#667eea22,#764ba222);color:var(--pri);font-weight:600}
  .ch .n{font-size:11px;color:var(--text2)}
  .ch .dot{width:6px;height:6px;border-radius:50%;background:#f59e0b;flex:none;display:none}
  .ch.edited .dot{display:block}
  .main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
  .topbar{height:52px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 14px;flex:none}
  .topbar .t{font-weight:600;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button{font-family:inherit;font-size:12.5px;padding:7px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--text);cursor:pointer}
  button:hover{border-color:var(--pri);color:var(--pri)}
  
.sync-status{display:none;padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:13px;line-height:1.5;word-break:break-word}
.sync-status.show{display:block}
.sync-status.info{background:#e6f0fb;color:#1b6fb8;border:1px solid #b6d6f2}
.sync-status.success{background:#e7f6ec;color:#137a3e;border:1px solid #a8dfbd}
.sync-status.error{background:#fdeaea;color:#c0392b;border:1px solid #f3c0c0}
[data-theme="dark"] .sync-status.info{background:#152838;color:#7fb8e8;border-color:#254a68}
[data-theme="dark"] .sync-status.success{background:#15301f;color:#6fce93;border-color:#2a5a3c}
[data-theme="dark"] .sync-status.error{background:#331616;color:#f0908a;border-color:#5e2b2b}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  button.pri:hover{opacity:.9;color:#fff}
  .ico{padding:7px 10px;font-size:15px}
  #find{padding:6px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--text);font-size:12.5px;font-family:inherit;width:150px}
  #map{flex:1;min-height:0;background:var(--bg)}
  .mob-mask{display:none}
  .status{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--text2);background:var(--card);padding:6px 12px;border-radius:20px;box-shadow:0 2px 8px #0001;max-width:70%}
  .modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
  .modal.show{display:flex}
  .mbox{background:var(--card);border-radius:12px;padding:22px;width:100%;max-width:420px}
  .mbox h3{font-size:16px;margin-bottom:6px}
  .mbox p{font-size:12.5px;color:var(--text2);margin-bottom:14px;line-height:1.6}
  .mbox label{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px}
  .mbox input{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
  .mbox .row{display:flex;gap:8px;margin-top:18px}
  .mbox .row button{flex:1;padding:9px}
  @keyframes mmPulse{0%,100%{outline:3px solid rgba(250,204,21,.95);outline-offset:2px}50%{outline:3px solid rgba(250,204,21,.2);outline-offset:6px}}
  .mm-hit{animation:mmPulse 1.2s ease-in-out 4}
  @media(max-width:768px){
    .sidebar{position:absolute;z-index:20;height:100%;box-shadow:4px 0 16px #0002}
    .mob-mask{display:block;position:absolute;inset:0;background:#0004;z-index:10}
    .mob-mask.hide{display:none}
    .topbar .t{font-size:13px}
    #find{width:110px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar hide" id="sidebar">
    <div class="side-h"><span>408 思维导图</span><small id="cnt"></small></div>
    <div class="side-list" id="list"></div>
  </aside>
  <div class="mob-mask hide" id="mask"></div>
  <main class="main">
    <div class="topbar">
      <button class="ico" id="btnSide">&#9776;</button>
      <span class="t" id="cur">请选择章节</span>
      <input id="find" placeholder="搜索节点…">
      <button id="btnFit">居中</button>
      <button id="btnReset">恢复原版</button>
      <button class="pri" id="btnSync">云同步</button>
    </div>
    <div id="map"></div>
    <div class="status" id="status">选择左侧章节开始</div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <h3>☁️ 云同步</h3>
    <p>使用 jsonbin.io 多设备同步导图编辑（与「408学习表」同一套凭证）。<br>
    <b>请用独立的 Bin</b>，勿与学习管理表共用，否则会互相覆盖。</p>

    <div id="sync-status"></div>

    <label>Access Key ID</label>
    <input autocomplete="off" data-lpignore="true" spellcheck="false" type="text" id="sync-key-id" placeholder="输入你的 Access Key ID">
    <label>X-Access-Key</label>
    <input autocomplete="off" data-lpignore="true" spellcheck="false" type="password" id="sync-access-key" placeholder="输入你的 X-Access-Key">
    <label>Bin ID（第一次使用留空，推送后自动创建）</label>
    <input autocomplete="off" data-lpignore="true" spellcheck="false" type="text" id="sync-bin-id" placeholder="已有Bin ID则填入，没有则留空">

    <div class="row">
      <button id="btnDown">⬇️ 从云端拉取</button>
      <button class="pri" id="btnUp">⬆️ 推送到云端</button>
    </div>

    <div id="sync-last-time" style="font-size:12px;color:var(--text2);margin-top:12px"></div>

    <p style="font-size:12px;color:var(--text2);line-height:1.7;margin:10px 0 0">
      ❓ 第一次使用：填好两个 Key，Bin ID 留空，点「推送到云端」会自动创建 Bin，然后把 Bin ID 保存下来。
    </p>

    <div class="row"><button id="btnClose">关闭</button></div>
  </div>
</div>

<script src="./vendor/mind-elixir.global.js"></script>
<script>
(function(){
var LS_CFG='mm408_cfg', LS_PFX='mm408:';
var mind=null, curFile=null, curChapter='', curSheet='', index=[], timer=null, lastHit=null;

function $(id){ return document.getElementById(id); }
function isDark(){ return document.documentElement.classList.contains('dark')||window.matchMedia('(prefers-color-scheme:dark)').matches; }
if(isDark()) document.documentElement.classList.add('dark');

function setStatus(t,keep){
  $('status').textContent=t;
  if(keep) return;
  clearTimeout(timer); timer=setTimeout(function(){ $('status').textContent=''; },4000);
}
function edited(f){ return !!localStorage.getItem(LS_PFX+f); }

function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=src;
    s.onload=function(){ if(s.parentNode) s.parentNode.removeChild(s); res(); };
    s.onerror=function(){ rej(new Error('无法加载 '+src)); };
    document.head.appendChild(s);
  });
}

/* ---------- 模糊匹配 ---------- */
function norm(s){
  return String(s||'')
    .replace(/[\s\u3000]/g,'')
    .replace(/[·、，,。.：:；;()（）\[\]【】《》""''"'"'\/\\\-—_]/g,'')
    .toLowerCase();
}
function matchScore(topic, kw, loose){
  var a=norm(topic), b=norm(kw);
  if(!a||!b) return 0;
  if(a===b) return 1000;
  if(a.indexOf(b)>=0) return 600 + Math.min(b.length,40)*4;
  if(b.indexOf(a)>=0) return 450 + Math.min(a.length,40)*4;
  var set={}, i, hit=0;
  for(i=0;i<b.length;i++) set[b[i]]=1;
  for(i=0;i<a.length;i++) if(set[a[i]]) hit++;
  var r = hit/Math.max(a.length,b.length);
  if(r>=0.55) return Math.round(400*r);
  /* 宽松模式（仅拆词时启用）：字符全包含 */
  if(loose && b.length>=4){
    var all=true;
    for(i=0;i<b.length;i++){ if(a.indexOf(b[i])<0){ all=false; break; } }
    if(all) return 250 + Math.min(b.length,20)*3;
  }
  return 0;
}
function splitKeywords(kw){
  return String(kw||'').split(/[\u548c\u4e0e\u53ca\u3001,+;\uff1b]/)
    .map(function(s){ return s.trim(); })
    .filter(function(s){ return norm(s).length>=3; });
}
function locateOne(rootNode, kw, loose){
  var best=null;
  (function walk(n, path){
    if(!n) return;
    var sc=matchScore(n.topic, kw, loose);
    if(sc>0){
      var cand={node:n, path:path.concat([n]), score:sc, depth:path.length};
      if(!best || cand.score>best.score || (cand.score>=best.score*0.95 && cand.depth>best.depth)) best=cand;
    }
    var ch=n.children||[];
    for(var i=0;i<ch.length;i++) walk(ch[i], path.concat([n]));
  })(rootNode, []);
  return best;
}
function locateInData(rootNode, keyword){
  var full = locateOne(rootNode, keyword, false);
  if(full) return full;
  var best=null, subs=splitKeywords(keyword);
  for(var i=0;i<subs.length;i++){
    var r = locateOne(rootNode, subs[i], true);
    if(r && (!best || r.score>best.score)) best=r;
  }
  return best;
}
function applyFocus(rootNode, hit){
  var onPath={};
  for(var i=0;i<hit.path.length;i++) onPath[hit.path[i].id]=1;
  (function walk(n, depth){
    if(n.children && n.children.length){
      n.expanded = (depth < 2) || !!onPath[n.id];
    }
    var ch=n.children||[];
    for(var j=0;j<ch.length;j++) walk(ch[j], depth+1);
  })(rootNode, 0);
  hit.node.style = Object.assign({}, hit.node.style||{}, {
    background:'#fde047', color:'#1f2937', fontWeight:'600', border:'2px solid #eab308'
  });
}
function focusNodeElement(nodeId){
  setTimeout(function(){
    var el=document.querySelector('[data-nodeid="'+nodeId+'"]');
    if(!el) return;
    try{ el.scrollIntoView({block:'center', inline:'center', behavior:'smooth'}); }catch(e){}
    el.classList.add('mm-hit');
  }, 500);
}

/* ---------- 导图 ---------- */
function initMind(data){
  if(mind){ try{ mind.destroy(); }catch(e){} }
  mind=new MindElixir({
    el:'#map', direction:MindElixir.RIGHT, draggable:true, editable:true,
    contextMenu:true, toolBar:true, keypress:true, overflowHidden:false,
    theme: isDark()? MindElixir.DARK_THEME : MindElixir.THEME
  });
  mind.init(data);
  if(mind.toCenter) mind.toCenter();
  mind.bus.addListener('operation', function(){ queueSave(); });
}
function queueSave(){
  if(!curFile) return;
  clearTimeout(queueSave._t);
  queueSave._t=setTimeout(function(){
    try{
      localStorage.setItem(LS_PFX+curFile, JSON.stringify(mind.getData()));
      setStatus('已自动保存到本机',true);
      var els=document.querySelectorAll('.ch');
      for(var i=0;i<els.length;i++) if(els[i].dataset.f===curFile) els[i].classList.add('edited');
    }catch(e){ setStatus('保存失败：'+e.message); }
  },800);
}

function loadChapter(item, keyword){
  curFile=item.file; curChapter=item.chapter; curSheet=item.sheet;
  $('cur').textContent=item.sheet+' · '+item.chapter + (keyword? ' · 定位「'+keyword+'」':'');
  var els=document.querySelectorAll('.ch');
  for(var i=0;i<els.length;i++) els[i].classList.toggle('on', els[i].dataset.f===curFile);
  $('sidebar').classList.add('hide'); $('mask').classList.add('hide');
  try{
    var hh='#'+item.file+(keyword? '|'+encodeURIComponent(keyword):'');
    if(location.hash!==hh) history.replaceState(null,'',hh);
  }catch(e){}
  setStatus('加载中…',true);

  function render(data, label){
    var hit=null;
    if(keyword){
      try{ hit=locateInData(data.nodeData, keyword); }catch(e){ hit=null; }
      if(hit){ applyFocus(data.nodeData, hit); lastHit=hit; } else lastHit=null;
    } else lastHit=null;
    initMind(data);
    if(hit) focusNodeElement(hit.node.id);
    var msg=label;
    if(keyword){
      msg += hit ? ' · 已定位「'+String(hit.node.topic).slice(0,18)+'」' : ' · 未找到「'+keyword+'」，显示整章';
    }
    setStatus(msg, true);
  }

  var local=localStorage.getItem(LS_PFX+item.file);
  if(local){ try{ render(JSON.parse(local),'已载入本机编辑版本'); return; }catch(e){} }
  window.MM_DATA=null;
  loadScript('./data/'+item.file+'.js').then(function(){
    if(!window.MM_DATA){ setStatus('数据为空'); return; }
    render(window.MM_DATA, '已载入原版 · 共 '+item.nodes+' 个节点');
  }).catch(function(e){ setStatus('加载失败：'+e.message); });
}

function renderList(){
  var list=$('list'), bySheet={}, order=[], i;
  for(i=0;i<index.length;i++){
    var it=index[i];
    if(!bySheet[it.sheet]){ bySheet[it.sheet]=[]; order.push(it.sheet); }
    bySheet[it.sheet].push(it);
  }
  $('cnt').textContent=index.length+' 章';
  var h='';
  for(var k=0;k<order.length;k++){
    var s=order[k];
    h+='<div class="grp"><div class="grp-t">'+s+'</div>';
    for(i=0;i<bySheet[s].length;i++){
      var t=bySheet[s][i];
      h+='<div class="ch'+(edited(t.file)?' edited':'')+'" data-f="'+t.file+'" data-s="'+t.sheet+'" data-c="'+t.chapter+'" data-n="'+t.nodes+'">'
        +'<span>'+t.chapter+'</span><span class="n">'+t.nodes+'</span><span class="dot"></span></div>';
    }
    h+='</div>';
  }
  list.innerHTML=h;
  var els=list.querySelectorAll('.ch');
  for(i=0;i<els.length;i++){
    els[i].onclick=(function(el){ return function(){
      loadChapter({sheet:el.dataset.s, chapter:el.dataset.c, file:el.dataset.f, nodes:el.dataset.n}, '');
    };})(els[i]);
  }
}

// ===== 云同步：完全照搬「考研408考点学习管理表」的实现 =====
const SYNC_CONFIG_KEY = 'mm408_sync_config';
let syncConfig = { keyId: '', accessKey: '', binId: '' };

function loadSyncConfig() {
  var saved = localStorage.getItem(SYNC_CONFIG_KEY);
  if (saved) { try { syncConfig = JSON.parse(saved); } catch(e) {} }
}
function saveSyncConfigLocal() {
  localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(syncConfig));
}
function saveSyncConfig() {
  syncConfig.keyId = $('sync-key-id').value.trim();
  syncConfig.accessKey = $('sync-access-key').value.trim();
  syncConfig.binId = $('sync-bin-id').value.trim();
  saveSyncConfigLocal();
  updateSyncStatus('success', '\u2713 配置已保存');
}
function updateSyncStatus(type, message) {
  var el = $('sync-status');
  el.className = 'sync-status' + (type ? ' ' + type : '');
  if (message) { el.textContent = message; el.classList.add('show'); }
  else { el.textContent = ''; el.classList.remove('show'); }
}

// 打包本机修改过的章节（只推修改过的，不推全量）
function buildSyncPayload() {
  var payload = {}, n = 0;
  for (var k in localStorage) {
    if (k.indexOf(LS_PFX) === 0) {
      try { payload[k.slice(LS_PFX.length)] = JSON.parse(localStorage.getItem(k)); n++; } catch(e) {}
    }
  }
  return { payload: payload, count: n };
}

async function syncPush() {
  saveSyncConfig();
  if (!syncConfig.keyId || !syncConfig.accessKey) {
    updateSyncStatus('error', '请先填写 Access Key ID 和 X-Access-Key');
    return;
  }
  var p = buildSyncPayload();
  if (!p.count) {
    updateSyncStatus('error', '本机还没有编辑过任何章节，先编辑导图再推送');
    return;
  }
  updateSyncStatus('info', '正在推送数据到云端...');
  try {
    if (syncConfig.binId) {
      var response = await fetch('https://api.jsonbin.io/v3/b/' + syncConfig.binId, {
        method: 'PUT',
        headers: {
          'X-Access-Key': syncConfig.accessKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(p.payload)
      });
      if (!response.ok) throw new Error('推送失败: ' + response.status);
      updateSyncStatus('success', '\u2713 推送成功！' + p.count + ' 个章节已同步到云端');
    } else {
      var response = await fetch('https://api.jsonbin.io/v3/b', {
        method: 'POST',
        headers: {
          'X-Access-Key': syncConfig.accessKey,
          'Content-Type': 'application/json',
          'X-Bin-Name': 'mm408_mindmap_data',
          'X-Bin-Private': 'true'
        },
        body: JSON.stringify(p.payload)
      });
      if (!response.ok) throw new Error('创建失败: ' + response.status);
      var result = await response.json();
      syncConfig.binId = result.metadata.id;
      $('sync-bin-id').value = syncConfig.binId;
      saveSyncConfigLocal();
      updateSyncStatus('success', '\u2713 创建成功！Bin ID: ' + syncConfig.binId + '（请保存好）');
    }
    var now = new Date().toLocaleString('zh-CN');
    localStorage.setItem('mm408_last_sync', now);
    $('sync-last-time').textContent = '上次同步: ' + now;
  } catch(e) {
    console.error('Sync push error:', e);
    updateSyncStatus('error', '推送失败: ' + e.message);
  }
}

async function syncPull() {
  saveSyncConfig();
  if (!syncConfig.keyId || !syncConfig.accessKey) {
    updateSyncStatus('error', '请先填写 Access Key ID 和 X-Access-Key');
    return;
  }
  if (!syncConfig.binId) {
    updateSyncStatus('error', '请先填写 Bin ID（首次使用请先推送）');
    return;
  }
  updateSyncStatus('info', '正在从云端拉取数据...');
  try {
    var response = await fetch('https://api.jsonbin.io/v3/b/' + syncConfig.binId + '/latest', {
      method: 'GET',
      headers: {
        'X-Access-Key': syncConfig.accessKey
      }
    });
    if (!response.ok) throw new Error('拉取失败: ' + response.status);
    var result = await response.json();
    if (!result.record) throw new Error('数据格式不正确');

    if (!confirm('确定要用云端数据覆盖本地数据吗？此操作不可撤销。')) {
      updateSyncStatus('info', '已取消');
      return;
    }

    var n = 0;
    for (var f in result.record) {
      localStorage.setItem(LS_PFX + f, JSON.stringify(result.record[f]));
      n++;
    }
    updateSyncStatus('success', '\u2713 拉取成功！已从云端载入 ' + n + ' 个章节');
    renderList();
    if (curFile && result.record[curFile]) loadChapter({sheet:curSheet, chapter:curChapter, file:curFile, nodes:'-'}, '');

    var now = new Date().toLocaleString('zh-CN');
    localStorage.setItem('mm408_last_sync', now);
    $('sync-last-time').textContent = '上次同步: ' + now;
  } catch(e) {
    console.error('Sync pull error:', e);
    updateSyncStatus('error', '拉取失败: ' + e.message);
  }
}

function openSyncModal() {
  loadSyncConfig();
  $('sync-key-id').value = syncConfig.keyId || '';
  $('sync-access-key').value = syncConfig.accessKey || '';
  $('sync-bin-id').value = syncConfig.binId || '';
  updateSyncStatus('', '');
  var lastSync = localStorage.getItem('mm408_last_sync');
  $('sync-last-time').textContent = lastSync ? ('上次同步: ' + lastSync) : '';
  $('modal').classList.add('show');
}
document.addEventListener('DOMContentLoaded', function(){
  $('btnSide').onclick=function(){ $('sidebar').classList.toggle('hide'); $('mask').classList.toggle('hide'); };
  $('mask').onclick=function(){ $('sidebar').classList.add('hide'); $('mask').classList.add('hide'); };
  $('btnFit').onclick=function(){ if(mind&&mind.toCenter) mind.toCenter(); };
  $('btnReset').onclick=function(){
    if(!curFile) return;
    if(!confirm('确定放弃本机对这个章节的修改，恢复原版吗？')) return;
    localStorage.removeItem(LS_PFX+curFile);
    var it=null;
    for(var i=0;i<index.length;i++) if(index[i].file===curFile) it=index[i];
    if(it) loadChapter(it, '');
    renderList();
  };
  $('btnSync').onclick=function(){ openSyncModal(); };
  $('btnClose').onclick=function(){ $('modal').classList.remove('show'); };
  $('btnUp').onclick=function(){ syncPush(); };
  $('btnDown').onclick=function(){ syncPull(); };

  /* 节点搜索 */
  $('find').addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    var kw=this.value.trim();
    if(!kw) return;
    if(!mind||!curFile){ setStatus('请先选择一个章节'); return; }
    var hit=locateInData(mind.getData().nodeData, kw);
    if(!hit){ setStatus('未找到「'+kw+'」'); return; }
    /* 展开路径 + 高亮 + 滚动 */
    var d=mind.getData();
    applyFocus(d.nodeData, hit);
    initMind(d);
    focusNodeElement(hit.node.id);
    setStatus('已定位「'+String(hit.node.topic).slice(0,20)+'」', true);
  });

  loadScript('./index.js').then(function(){
    index=window.MM_INDEX||[];
    renderList();
    setStatus('共 '+index.length+' 章 · 选择左侧章节开始');
    if(window.innerWidth>768) $('sidebar').classList.remove('hide');
    var want=decodeURIComponent((location.hash||'').replace('#','')) || (new URLSearchParams(location.search)).get('ch') || '';
    if(want){
      var parts=want.split('|');
      var chId=parts[0], kw=parts[1]||'';
      for(var i=0;i<index.length;i++){ if(index[i].file===chId){ loadChapter(index[i], kw); break; } }
    }
  }).catch(function(e){ setStatus('索引加载失败：'+e.message); });
});
})();
</script>
</body>
</html>
