<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>每日规划 · 80 天冲刺</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text2: #64748b; --text3: #94a3b8;
  --brand: #667eea; --brand2: #764ba2; --brand-soft: #eef2ff;
  --ok: #10b981; --warn: #f59e0b; --danger: #ef4444;
}
body.dark {
  --bg: #0f172a; --card: #1e293b; --border: #334155;
  --text: #f1f5f9; --text2: #cbd5e1; --text3: #94a3b8;
  --brand-soft: rgba(102,126,234,0.14);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  padding-bottom: 40px; transition: background 0.3s, color 0.3s;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

/* ===== header ===== */
.hero {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white; padding: 26px 0 22px; position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px;
  border-radius: 50%; background: rgba(255,255,255,0.08);
}
.hero-row { display: flex; align-items: center; justify-content: space-between; }
.hero h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
.hero-date { font-size: 13px; opacity: 0.9; margin-top: 4px; }
.hero-stats { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.hero-chip {
  background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
  border-radius: 12px; padding: 10px 16px; min-width: 110px;
}
.hero-chip .num { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hero-chip .lbl { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.hero-chip .num small { font-size: 14px; opacity: 0.8; font-weight: 600; }
.stage-chip { margin-top: 14px; background: rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 16px; }
.stage-chip .s-name { font-size: 14px; font-weight: 700; }
.stage-chip .s-range { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.stage-bar { height: 5px; background: rgba(255,255,255,0.25); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.stage-bar i { display: block; height: 100%; background: #fbbf24; border-radius: 3px; transition: width 0.5s; }
.hero-foot { margin-top: 10px; font-size: 11px; opacity: 0.8; }

/* ===== 通用卡片 ===== */
.sec { margin-top: 26px; }
.sec-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.sec-title small { font-weight: 400; color: var(--text3); font-size: 12px; margin-left: auto; }

/* ===== 分类样式 ===== */
.cat-badge {
  font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 7px;
  flex-shrink: 0;
}
.cat-badge.cat-new { background: #fed7aa; color: #9a3412; }
.cat-badge.cat-review { background: #dcfce7; color: #15803d; }
.cat-badge.cat-memory { background: #f3e8ff; color: #6b21a8; }
.cat-badge.cat-break { background: #f1f5f9; color: #64748b; }
.cat-badge.cat-other { background: #e0e7ff; color: #4338ca; }
.cat-badge.cat-en { background: #dbeafe; color: #1e40af; }
.cat-badge.cat-math { background: #dcfce7; color: #15803d; }
.cat-badge.cat-408 { background: #fef3c7; color: #b45309; }
.cat-badge.cat-pol { background: #fce7f3; color: #be185d; }
body.dark .cat-badge.cat-new { background: rgba(249,115,22,0.2); color: #fdba74; }
body.dark .cat-badge.cat-review { background: rgba(22,163,74,0.2); color: #86efac; }
body.dark .cat-badge.cat-memory { background: rgba(147,51,234,0.2); color: #d8b4fe; }
body.dark .cat-badge.cat-break { background: rgba(100,116,139,0.2); color: #cbd5e1; }
body.dark .cat-badge.cat-other { background: rgba(67,56,202,0.2); color: #c7d2fe; }
body.dark .cat-badge.cat-en { background: rgba(59,130,246,0.2); color: #93c5fd; }
body.dark .cat-badge.cat-math { background: rgba(22,163,74,0.2); color: #86efac; }
body.dark .cat-badge.cat-408 { background: rgba(217,119,6,0.2); color: #fcd34d; }
body.dark .cat-badge.cat-pol { background: rgba(190,24,93,0.2); color: #fbcfe8; }

/* ===== 自定义时间表（sessions）===== */
.sessions {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
}
.session-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.session {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
}
.session.now { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
.session.done { background: rgba(16,185,129,0.06); border-color: rgba(16,185,129,0.3); }
.session.done .session-title { text-decoration: line-through; color: var(--text3); }
.session-icon {
  width: 36px; height: 36px; border-radius: 8px; background: var(--brand-soft);
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.session-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.session-title { font-size: 14px; font-weight: 600; word-break: break-word; }
.session-meta { font-size: 11px; color: var(--text3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.session-time {
  font-size: 11px; font-weight: 700; color: var(--brand);
  background: var(--brand-soft); padding: 2px 8px; border-radius: 6px;
  font-variant-numeric: tabular-nums; flex-shrink: 0;
}
.session-duration {
  font-size: 11px; color: var(--text2); font-variant-numeric: tabular-nums;
  padding: 2px 8px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border);
  flex-shrink: 0;
}
.session-now-tag { font-size: 10px; color: var(--danger); font-weight: 700; }
.session-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.session-cb {
  width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: transparent; background: transparent; transition: all 0.15s;
}
.session-cb.on { background: var(--ok); border-color: var(--ok); color: white; }
.session-del {
  width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent;
  color: var(--text3); cursor: pointer; font-size: 13px;
}
.session-del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
.add-bar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 10px 12px; background: var(--bg); border-radius: 10px;
}
.add-bar input {
  flex: 1; min-width: 180px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 13px; font-family: inherit;
}
.add-bar input:focus { outline: none; border-color: var(--brand); }
.add-bar input[type="time"] { flex: 0 0 100px; min-width: 100px; }
.add-bar select {
  padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 12px; font-family: inherit;
  flex-shrink: 0;
}
.add-bar button {
  padding: 7px 14px; border-radius: 8px; border: none; font-family: inherit;
  background: linear-gradient(135deg, #667eea, #764ba2); color: white;
  font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
}
.add-bar button:hover { opacity: 0.9; }

/* ===== 自定义任务 ===== */
.tasks {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
}
.task-list { display: flex; flex-direction: column; gap: 6px; }
.task {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
}
.task.done { background: rgba(16,185,129,0.06); border-color: rgba(16,185,129,0.3); }
.task.done .task-title { text-decoration: line-through; color: var(--text3); }
.task-cb {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border);
  flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent; background: transparent; transition: all 0.15s;
}
.task-cb.on { background: var(--ok); border-color: var(--ok); color: white; }
.task-main { flex: 1; min-width: 0; }
.task-title { font-size: 13.5px; font-weight: 500; word-break: break-word; }
.task-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
.task-del {
  width: 24px; height: 24px; border-radius: 6px; border: none; background: transparent;
  color: var(--text3); cursor: pointer; font-size: 14px; flex-shrink: 0;
}
.task-del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
.task-add {
  display: flex; gap: 8px; margin-top: 10px;
}
.task-add input {
  flex: 1; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; min-width: 0;
}
.task-add input:focus { outline: none; border-color: var(--brand); }
.task-add button {
  padding: 8px 16px; border-radius: 10px; border: none; font-family: inherit;
  background: linear-gradient(135deg, #667eea, #764ba2); color: white;
  font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
}

/* ===== 关键节点 ===== */
.milestones {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
}
.ms-list { display: flex; flex-direction: column; gap: 6px; }
.ms-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
  border-left: 3px solid var(--brand);
}
.ms-item.past { opacity: 0.5; border-left-color: var(--text3); }
.ms-item.urgent { border-left-color: var(--danger); background: rgba(239,68,68,0.05); }
.ms-item.soon { border-left-color: var(--warn); background: rgba(245,158,11,0.05); }
.ms-icon {
  width: 32px; height: 32px; border-radius: 8px; background: var(--brand-soft);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.ms-main { flex: 1; min-width: 0; }
.ms-name { font-size: 13.5px; font-weight: 600; }
.ms-desc { font-size: 11px; color: var(--text3); margin-top: 2px; }
.ms-right { text-align: right; flex-shrink: 0; }
.ms-date {
  font-size: 11px; color: var(--text2); font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.ms-countdown {
  font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums;
  color: var(--brand); line-height: 1.2;
}
.ms-countdown.past { color: var(--text3); font-size: 12px; font-weight: 600; }
.ms-countdown.urgent { color: var(--danger); }
.ms-countdown.soon { color: var(--warn); }
.ms-countdown small { font-size: 10px; font-weight: 600; opacity: 0.8; }

/* ===== 待复习卡片 ===== */
.review-cards {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
}
.rc-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}
.rc-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.rc-count { font-size: 12px; color: var(--brand); font-weight: 700; }
.rc-list { display: flex; flex-direction: column; gap: 6px; }
.rc-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--border); border-left: 3px solid var(--brand);
  border-radius: 10px; background: var(--bg);
}
.rc-item.overdue { border-left-color: var(--danger); }
.rc-item.today { border-left-color: var(--warn); }
.rc-cb {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border);
  flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent; background: transparent; transition: all 0.15s;
}
.rc-cb:hover { border-color: var(--ok); }
.rc-main { flex: 1; min-width: 0; }
.rc-name { font-size: 13.5px; font-weight: 500; word-break: break-word; }
.rc-meta { font-size: 11px; color: var(--text3); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rc-del {
  width: 24px; height: 24px; border-radius: 6px; border: none; background: transparent;
  color: var(--text3); cursor: pointer; font-size: 14px; flex-shrink: 0;
}
.rc-del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
.rc-empty { text-align: center; padding: 14px; color: var(--text3); font-size: 13px; }
.rc-empty .big { font-size: 28px; margin-bottom: 6px; }

/* ===== AI 顾问 ===== */
.ai-advisor {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
}
.ai-advisor-desc {
  font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 12px;
  background: var(--brand-soft); padding: 10px 12px; border-radius: 8px;
}
.ai-advisor-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ai-advisor-actions button {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent;
  color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.ai-advisor-actions button:hover { border-color: var(--brand); color: var(--brand); }
.ai-advisor-actions button.primary {
  background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent;
}

/* ===== 工具栏 ===== */
.toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 14px; padding: 10px 16px;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
}
.toolbar-btn {
  font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: transparent; color: var(--text2);
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.toolbar-btn:hover { border-color: var(--brand); color: var(--brand); }
.toolbar-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.08); }
.toolbar-btn.primary {
  background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent;
}
.toolbar-info { font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }

/* ===== footer ===== */
.foot {
  text-align: center; font-size: 11px; color: var(--text3); margin-top: 30px;
}
.foot a { color: var(--brand); }

/* ===== 模态框 ===== */
.modal {
  position: fixed; inset: 0; z-index: 200; display: none;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
  align-items: center; justify-content: center; padding: 16px;
}
.modal.show { display: flex; }
.modal-box {
  background: var(--card); border-radius: 14px; padding: 18px 20px;
  max-width: 520px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  max-height: 80vh; overflow-y: auto;
}
.modal-title {
  font-size: 15px; font-weight: 700; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title .close {
  width: 26px; height: 26px; border-radius: 6px; border: none; background: var(--bg);
  color: var(--text2); cursor: pointer; font-size: 14px;
}
.modal-title .close:hover { background: rgba(239,68,68,0.1); color: var(--danger); }
.modal-form { display: flex; flex-direction: column; gap: 12px; }
.modal-form label {
  font-size: 12px; color: var(--text2); font-weight: 600;
  display: flex; flex-direction: column; gap: 4px;
}
.modal-form label .row {
  display: flex; gap: 8px; align-items: center;
}
.modal-form label .row .flex-grow { flex: 1; min-width: 0; }
.modal-form input, .modal-form select {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit;
  width: 100%; box-sizing: border-box;
}
.modal-form input:focus, .modal-form select:focus { outline: none; border-color: var(--brand); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.modal-actions button {
  padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.modal-actions button.primary {
  background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent;
}

/* ===== 导出模态 ===== */
.clip-body {
  background: var(--bg); border-radius: 10px; padding: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word; max-height: 380px; overflow-y: auto;
  color: var(--text); line-height: 1.6;
}
.clip-hint { font-size: 12px; color: var(--text3); margin-top: 8px; line-height: 1.6; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--card); padding: 10px 20px; border-radius: 10px;
  font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 300;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--ok); }
.toast.error { background: var(--danger); }

@media (max-width: 640px) {
  .hero-stats { gap: 8px; }
  .hero-chip { min-width: 90px; padding: 8px 12px; }
  .hero-chip .num { font-size: 20px; }
  .add-bar { flex-direction: column; align-items: stretch; }
  .add-bar input[type="time"] { flex: 1; min-width: 0; }
  .session-duration, .session-time { font-size: 10px; padding: 1px 6px; }
}
</style>
</head>
<body>

<div id="app"></div>

<!-- 通用模态 -->
<div class="modal" id="general-modal">
  <div class="modal-box">
    <div class="modal-title">
      <span id="modal-title-text">操作</span>
      <button class="close" onclick="window.__modalClose()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- 导出汇报模态 -->
<div class="modal" id="export-modal">
  <div class="modal-box">
    <div class="modal-title">
      <span>📋 导出今日汇报</span>
      <button class="close" onclick="window.__exportClose()">✕</button>
    </div>
    <div class="clip-body" id="export-content"></div>
    <div class="clip-hint">复制以下内容到 AI（如 Gemini/GPT）询问明日建议，或将 JSON 反馈给我更新计划。</div>
    <div class="modal-actions">
      <button class="primary" onclick="window.__copyExport()">复制到剪贴板</button>
    </div>
  </div>
</div>

<!-- 清空数据确认模态 -->
<div class="modal" id="reset-modal">
  <div class="modal-box">
    <div class="modal-title">⚠️ 清空所有数据</div>
    <p style="font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 12px;">
      这将清空：<br>
      · 所有打卡记录<br>
      · 所有 AI 费曼复盘对话历史<br>
      · 所有日程计划<br>
      · 所有自定义任务<br>
      · 所有背诵卡片<br><br>
      <b>保留</b>：<br>
      · 408 考点表（与学习表共享的进度数据）
    </p>
    <div class="modal-actions">
      <button onclick="window.__resetCancel()">取消</button>
      <button class="primary" onclick="window.__resetConfirm()" style="background:var(--danger);border-color:transparent;">清空</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 数据键 =====
var DATA_KEY_V2 = 'kaoyan_408_v2';        // 主数据（sessions + tasks + reset 标记）
var SPRINT_START_V2 = '2026-09-29';       // 冲刺开始（今天）
var PLAN_END_V2 = '2026-12-18';           // 计划最后一天（公式背诵+调整心态）
var EXAM_DATE_V2 = '2026-12-19';          // 考试日
var FLASHCARDS_KEY = 'kaoyan_flashcards_v1';  // 背诵卡片（保留）
var DATA_KEY_V1 = 'kaoyan_408_study_data_v1'; // 408 考点表（保留）

// 80 天冲刺 4 阶段（含冲刺准备期）

// ===== 工具 =====
function pad(n) { return String(n).padStart(2, '0'); }
function getTodayStr() {
  var t = new Date();
  return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
}
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function addDays(dateStr, n) {
  var dt = new Date(dateStr + 'T00:00:00');
  dt.setDate(dt.getDate() + n);
  return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
function attrJsStr(s) {
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
    .replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function readJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
}

// ===== 关键词检测 =====
function isReviewTask(text) {
  if (!text) return false;
  return KEYWORDS_REVIEW.some(function (k) { return text.indexOf(k) >= 0; });
}
function inferCategory(text) {
  if (!text) return '其他';
  if (/英语|单词|真题|阅读/.test(text)) return '英语真题单词';
  if (/公式|积分|行列式|特征值|导数|微分/.test(text)) return '数学公式';
  if (/408|计组|操作|OS|计网|Cache|进程|线程|路由|TCP/.test(text)) return '408口诀';
  if (/政治|马原|毛中特|史纲|思修|时政/.test(text)) return '政治口诀';
  return '其他';
}

// ===== 阶段计算 =====
function getSprintStats() {
  var today = getTodayStr();
  var totalDays = daysBetween(SPRINT_START_V2, EXAM_DATE_V2);
  var dayIndex = daysBetween(SPRINT_START_V2, today);
  var daysLeft = daysBetween(today, EXAM_DATE_V2);
  
  var currentStage = null;
  var stagePct = 0;
  for (var i = 0; i < STAGES_V2.length; i++) {
    var st = STAGES_V2[i];
    if (today >= st.range[0] && today <= st.range[1]) {
      currentStage = st;
      var stageLen = daysBetween(st.range[0], st.range[1]) + 1;
      stagePct = Math.min(100, Math.max(0, Math.round((daysBetween(st.range[0], today) + 1) / stageLen * 100)));
      break;
    }
  }
  
  return {
    dayIndex: dayIndex,
    totalDays: totalDays,
    daysLeft: daysLeft,
    stage: currentStage,
    stagePct: stagePct
  };
}

function catById(id) {

  }
  return CATEGORIES[CATEGORIES.length - 1];
}
function fmtClock(timeStr) {
  if (!timeStr) return '';
  var parts = timeStr.split(':');
  return (parseInt(parts[0]) || 0) + ':' + (parts[1] || '00');
}
function getDueFlashcards() {
  var fcs = readJson(FLASHCARDS_KEY, []);
  var today = getTodayStr();
  return fcs.filter(function (f) {
    return f.status === 'active' && f.nextReviewAt <= today;
  });
}

function addSession(time, duration, title, catId) {
  if (!title || !title.trim()) {
    showToast('请输入标题', 'error');
    return;
  }
  data.sessions.push({
    id: 's_' + Date.now(),
    time: time || '',
    duration: duration || 30,
    title: title.trim(),
    cat: catId || 'other',
    done: false
  });
  saveData();
  render();
}
function deleteSession(id) {
  data.sessions = data.sessions.filter(function (s) { return s.id !== id; });
  saveData();
  render();
}
function toggleSession(id) {
  data.sessions.forEach(function (s) {
    if (s.id === id) s.done = !s.done;
  });
  saveData();
  render();
}
function updateSession(id, field, value) {
  data.sessions.forEach(function (s) {
    if (s.id === id) s[field] = value;
  });
  saveData();
  render();
}

// ===== 任务操作 =====
function addTask(text) {
  if (!text || !text.trim()) return;
  data.customTasks.push({
    id: 't_' + Date.now(),
    text: text.trim(),
    done: false,
    addedAt: getTodayStr(),
    inferredCat: isReviewTask(text) ? inferCategory(text) : null
  });
  saveData();
  render();
}
function deleteTask(idx) {
  data.customTasks.splice(idx, 1);
  saveData();
  render();
}
function toggleTask(idx) {
  if (!data.customTasks[idx]) return;
  var t = data.customTasks[idx];
  t.done = !t.done;
  if (t.done && isReviewTask(t.text)) {
    // 创建/更新 flashcard
    var fcs = readJson(FLASHCARDS_KEY, []);
    var existing = fcs.find(function (f) {
      return f.status === 'active' && f.sourceCustom === t.id;
    });
    var today = getTodayStr();
    if (existing) {
      existing.attempts = (existing.attempts || 0) + 1;
      existing.lastReviewedAt = today;
      var i2 = Math.min(existing.attempts, REVIEW_INTERVALS.length - 1);
      existing.nextReviewAt = addDays(today, REVIEW_INTERVALS[i2]);
      localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(fcs));
      t.reviews = existing.attempts;
    } else {
      var fc = {
        id: 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        category: t.inferredCat || '其他',
        content: t.text,
        sourceCustom: t.id,
        learnedAt: today,
        attempts: 1,
        lastReviewedAt: today,
        nextReviewAt: addDays(today, REVIEW_INTERVALS[0]),
        status: 'active'
      };
      fcs.push(fc);
      localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(fcs));
      t.reviews = 1;
    }
  }
  saveData();
  render();
}

// ===== 复习卡片操作 =====
function toggleFlashcard(id) {
  var fcs = readJson(FLASHCARDS_KEY, []);
  var fc = fcs.find(function (f) { return f.id === id; });
  if (!fc) return;
  fc.attempts = (fc.attempts || 0) + 1;
  fc.lastReviewedAt = getTodayStr();
  var idx2 = Math.min(fc.attempts, REVIEW_INTERVALS.length - 1);
  fc.nextReviewAt = addDays(getTodayStr(), REVIEW_INTERVALS[idx2]);
  localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(fcs));
  // 同步 customTask
  if (data.customTasks) {
    data.customTasks.forEach(function (t) {
      if (isReviewTask(t.text)) {
        var fc2 = readJson(FLASHCARDS_KEY, []).find(function (f) { return f.id === id; });
        if (fc2 && fc2.sourceCustom === t.id) {
          t.reviews = fc2.attempts;
        }
      }
    });
    saveData();
  }
  render();
}
function deleteFlashcard(id) {
  var fcs = readJson(FLASHCARDS_KEY, []);
  localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(fcs.filter(function (f) { return f.id !== id; })));
  render();
}

function exportToday() {
  var stats = getSprintStats();

  var sessions = data.sessions.map(function (s) {
    return {
      time: s.time,
      duration: s.duration,

  });
  var tasks = data.customTasks.map(function (t) {
    return { text: t.text, done: t.done, isReview: isReviewTask(t.text), cat: t.inferredCat };
  });
  var reviewCards = getDueFlashcards().map(function (f) {
    return { content: f.content, cat: f.category, attempt: f.attempts, due: f.nextReviewAt };
  });
  var report = {
    date: today,
    sprint: {
      start: SPRINT_START_V2,
      exam: EXAM_DATE_V2,
      day: stats.dayIndex,
      daysLeft: stats.daysLeft,
      stage: stats.stage ? stats.stage.name : '冲刺准备期'
    },
    todaySessions: sessions,
    todayTasks: tasks,
    todayReviewCards: reviewCards
  };
  document.getElementById('export-content').textContent = JSON.stringify(report, null, 2);
  document.getElementById('export-modal').classList.add('show');
}
function copyExport() {
  var text = document.getElementById('export-content').textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { showToast('已复制', 'success'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制', 'success'); }
    catch (e) { showToast('复制失败', 'error'); }
    document.body.removeChild(ta);
  }
}

    var cls = isPast ? 'past' : (days <= 7 ? 'urgent' : (days <= 20 ? 'soon' : ''));
    var cdCls = isPast ? 'past' : (days <= 7 ? 'urgent' : (days <= 20 ? 'soon' : ''));
    var cdTxt = isPast ? '已过' : (isToday ? '今天' : days + '<small> 天</small>');
    html += '<div class="ms-item ' + cls + '">';
    html += '<div class="ms-icon">' + ms.icon + '</div>';
    html += '<div class="ms-main">';
    html += '<div class="ms-name">' + escapeHtml(ms.name) + '</div>';
    html += '<div class="ms-desc">' + escapeHtml(ms.desc) + '</div>';
    html += '</div>';
    html += '<div class="ms-right">';
    html += '<div class="ms-date">' + ms.date.slice(5).replace('-', '.') + '</div>';
    html += '<div class="ms-countdown ' + cdCls + '">' + cdTxt + '</div>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div></div></div>';

  // ===== 今日待复习卡片 =====
  var dueCards = getDueFlashcards();
  html += '<div class="review-cards">';
  html += '<div class="rc-head">';
  html += '<div class="rc-title">🔔 今日待复习 <small style="font-weight:400;color:var(--text3);font-size:11px">（按遗忘曲线 1/2/4/7/15/30 天）</small></div>';
  html += '<span class="rc-count">' + dueCards.length + ' 项</span>';
  html += '</div>';
  if (!dueCards.length) {
    html += '<div class="rc-empty"><div class="big">🎉</div>今日无到期复习任务<br><small>完成含「背诵/默写」字样的自定义任务会自动生成复习</small></div>';
  } else {
    html += '<div class="rc-list">';
    dueCards.forEach(function (fc) {
      var overdue = fc.nextReviewAt < today;
      var cls = overdue ? 'overdue' : (fc.nextReviewAt === today ? 'today' : '');
      var catCls = { '英语真题单词': 'cat-en', '数学公式': 'cat-math', '408口诀': 'cat-408', '政治口诀': 'cat-pol' }[fc.category] || 'cat-other';
      html += '<div class="rc-item ' + cls + '">';
      html += '<button class="rc-cb" onclick="window.__toggleFlashcard(\'' + fc.id + '\')" title="标记完成">✓</button>';
      html += '<div class="rc-main">';
      html += '<div class="rc-name">' + escapeHtml(fc.content) + '</div>';
      html += '<div class="rc-meta">';
      html += '<span class="cat-badge ' + catCls + '">' + escapeHtml(fc.category) + '</span>';
      html += '<span>第 ' + (fc.attempts + 1) + ' 次复习</span>';
      html += '<span>' + (overdue ? '⚠️ 已逾期 ' + daysBetween(fc.nextReviewAt, today) + ' 天' : '📌 今日到期') + '</span>';
      html += '<span>首学: ' + fc.learnedAt.slice(5).replace('-', '.') + '</span>';
      html += '</div></div>';
      html += '<button class="rc-del" onclick="window.__deleteFlashcard(\'' + fc.id + '\')" title="移除">✕</button>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  
  // ===== 自定义任务 =====
  html += '<div class="sec"><div class="sec-title">📝 自定义任务 <small>含「背诵/默写」字样的任务完成时自动创建复习</small></div>';
  html += '<div class="tasks">';
  if (!data.customTasks.length) {
    html += '<div class="rc-empty" style="padding:10px"><div class="big" style="font-size:22px">📋</div>今日无自定义任务，在下方添加</div>';
  } else {
    html += '<div class="task-list">';
    data.customTasks.forEach(function (t, idx) {
      var done = !!t.done;
      var isRv = isReviewTask(t.text);
      html += '<div class="task' + (done ? ' done' : '') + '">';
      html += '<button class="task-cb' + (done ? ' on' : '') + '" onclick="window.__toggleTask(' + idx + ')">✓</button>';
      html += '<div class="task-main">';
      html += '<div class="task-title">' + escapeHtml(t.text) + '</div>';
      if (isRv) {
        html += '<div class="task-meta">🔁 ' + (done ? '已生成复习 · 第 ' + (t.reviews || 0) + ' 次完成' : '完成时自动安排复习') + '</div>';
      }
      html += '</div>';
      if (isRv) {
        html += '<span class="cat-badge cat-en">🔁 ' + escapeHtml(t.inferredCat) + '</span>';
      }
      html += '<button class="task-del" onclick="window.__deleteTask(' + idx + ')">✕</button>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '<div class="task-add">';
  html += '<input id="task-input" type="text" placeholder="添加今日任务（如：背诵 2023 真题 Part 1 单词）" onkeydown="if(event.key===\'Enter\'){window.__addTask();}">';
  html += '<button onclick="window.__addTask()">+ 添加</button>';
  html += '</div></div></div>';
  
  // ===== 自定义时间表 =====
  html += '<div class="sec"><div class="sec-title">⏰ 自定义时间表 <small>每天自己安排，点编辑可改时间/时长/类别</small></div>';
  html += '<div class="sessions">';
  if (!data.sessions.length) {
    html += '<div class="rc-empty" style="padding:20px"><div class="big" style="font-size:32px">📅</div>今天还没安排时间表<br><small>点击下方「+ 添加时间表」开始安排今日学习计划</small></div>';
  } else {
    html += '<div class="session-list">';
    data.sessions.forEach(function (s) {
      var nowIs = false;
      if (s.time) {
        var parts = s.time.split(':');
        var sMin = (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0);
        nowIs = nowMin >= sMin && nowMin < sMin + s.duration;
      }
      var cat = catById(s.cat);
      html += '<div class="session' + (nowIs ? ' now' : '') + (s.done ? ' done' : '') + '">';
      html += '<div class="session-icon">' + cat.icon + '</div>';
      html += '<div class="session-main">';
      html += '<div class="session-title">' + escapeHtml(s.title) + (nowIs ? ' <span class="session-now-tag">进行中</span>' : '') + '</div>';
      html += '<div class="session-meta"><span class="cat-badge cat-' + cat.id + '">' + cat.name + '</span></div>';
      html += '</div>';
      if (s.time) html += '<span class="session-time">' + fmtClock(s.time) + '</span>';
      html += '<span class="session-duration">' + s.duration + 'min</span>';
      html += '<div class="session-actions">';
      html += '<button class="session-cb' + (s.done ? ' on' : '') + '" onclick="window.__toggleSession(\'' + s.id + '\')">✓</button>';
      html += '<button class="session-del" onclick="window.__editSession(\'' + s.id + '\')" title="编辑">✏️</button>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '<div class="add-bar">';
  html += '<input type="time" id="add-time-quick" value="08:00">';
  html += '<input type="number" id="add-duration-quick" value="30" min="5" max="240" step="5" style="flex:0 0 70px;min-width:70px;">';
  html += '<select id="add-cat-quick">' + CATEGORIES.map(function(c){return '<option value="'+c.id+'">'+c.icon+' '+c.name+'</option>';}).join('') + '</select>';
  html += '<input type="text" id="add-title-quick" placeholder="今天学什么？" onkeydown="if(event.key===\'Enter\'){window.__quickAddSession();}">';
  html += '<button onclick="window.__quickAddSession()">+ 添加</button>';
  html += '</div>';
  html += '</div></div>';
  
  // ===== AI 顾问 =====
  html += '<div class="sec"><div class="sec-title">🤖 AI 顾问 <small>每天可问 AI 怎么调整</small></div>';
  html += '<div class="ai-advisor">';
  html += '<div class="ai-advisor-desc">导出今日汇报 → 粘贴到 AI（如 Gemini/GPT）询问明日建议 → 把 AI 的建议反馈回来更新计划。AI 会根据你的考点进度、完成情况和背诵任务给出具体调整建议。</div>';
  html += '<div class="ai-advisor-actions">';
  html += '<button class="primary" onclick="window.__exportToday()">📋 导出今日汇报</button>';
  html += '<button onclick="window.__hermesReport()">📊 查看考点进度</button>';
  html += '</div>';
  html += '</div></div>';
  
  // ===== footer =====
  html += '<div class="foot">数据与 <a href="考研408考点学习管理表.html">408 学习表</a> · <a href="review/">复习资料库</a> 同源共享 &nbsp;·&nbsp; 80 天冲刺 · 目标 330 分';
  html += '<br><button class="toolbar-btn danger" style="margin-top:8px;" onclick="window.__clearAll()">⚠️ 清空所有数据</button>';
  html += '</div>';
  
  html += '</div>';
  
  document.getElementById('app').innerHTML = html;
}

// ===== AI 顾问：考点进度 =====
function hermesReport() {
  var appData = readJson(DATA_KEY_V1, null);
  if (!appData || !Object.keys(appData).length) {
    openModal('📊 考点进度', '<p style="font-size:13px;color:var(--text2);line-height:1.7;">还没有 408 考点数据。请先打开 <a href="考研408考点学习管理表.html" style="color:var(--brand);font-weight:600;">408 学习表</a> 初始化考点数据。</p>');
    return;
  }
  var sheets = ['Sheet1_数据结构', 'Sheet2_计算机组成原理', 'Sheet3_操作系统', 'Sheet4_计算机网络'];
  var display = { 'Sheet1_数据结构': '数据结构', 'Sheet2_计算机组成原理': '组成原理', 'Sheet3_操作系统': '操作系统', 'Sheet4_计算机网络': '计算机网络' };
  var html = '<div style="display:flex;flex-direction:column;gap:10px;">';
  sheets.forEach(function (sheet) {
    var items = appData[sheet] || [];
    var total = items.length;
    var mastered = items.filter(function (it) { return it['掌握程度'] === '已掌握'; }).length;
    var learning = items.filter(function (it) { return it['掌握程度'] === '学习中'; }).length;
    var pct = total ? Math.round(mastered / total * 100) : 0;
    html += '<div style="background:var(--bg);border-radius:10px;padding:10px 12px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">';
    html += '<span style="font-size:13px;font-weight:700;">' + display[sheet] + '</span>';
    html += '<span style="font-size:16px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;">' + pct + '%</span>';
    html += '</div>';
    html += '<div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px;">';
    html += '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#667eea,#10b981);"></div>';
    html += '</div>';
    html += '<div style="font-size:11px;color:var(--text3);">已掌握 <b>' + mastered + '</b> · 学习中 <b>' + learning + '</b> · 未开始 <b>' + (total - mastered - learning) + '</b> / ' + total + '</div>';
    html += '</div>';
  });
  html += '</div>';
  openModal('📊 408 考点进度（共享数据）', html);
}

// ===== 主题 =====
function toggleTheme() {
  var dark = document.body.classList.toggle('dark');
  localStorage.setItem('kaoyan_408_theme', dark ? 'dark' : 'light');
  render();
}

// ===== 桥接 =====
window.__toggleTheme = toggleTheme;
window.__addSession = addSessionForm;
window.__submitAddSession = submitAddSession;
window.__editSession = editSessionForm;
window.__submitEditSession = submitEditSession;
window.__deleteSession = confirmDeleteSession;
window.__doDeleteSession = function(id) { closeModal(); deleteSession(id); };
window.__toggleSession = toggleSession;
window.__addTask = function() {
  var inp = document.getElementById('task-input');
  if (!inp) return;
  var text = inp.value.trim();
  if (!text) return;
  addTask(text);
  inp.value = '';
};
window.__toggleTask = toggleTask;
window.__deleteTask = deleteTask;
window.__toggleFlashcard = toggleFlashcard;
window.__deleteFlashcard = deleteFlashcard;
window.__openModal = openModal;
window.__closeModal = closeModal;
window.__exportToday = exportToday;
window.__exportClose = function() { document.getElementById('export-modal').classList.remove('show'); };
window.__copyExport = copyExport;
window.__hermesReport = hermesReport;
window.__clearAll = clearAllConfirm;
window.__doClearAll = doClearAll;
window.__quickAddSession = function() {
  var time = document.getElementById('add-time-quick').value;
  var duration = parseInt(document.getElementById('add-duration-quick').value) || 30;
  var cat = document.getElementById('add-cat-quick').value;
  var title = document.getElementById('add-title-quick').value;
  addSession(time, duration, title, cat);
  var inp = document.getElementById('add-title-quick');
  if (inp) inp.value = '';
};

// 加载时恢复主题
(function() {
  var theme = localStorage.getItem('kaoyan_408_theme');
  if (theme === 'dark') document.body.classList.add('dark');
})();

// 初始渲染
render();
</script>
